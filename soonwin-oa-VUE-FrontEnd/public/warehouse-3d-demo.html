<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存位置图 · Three.js Demo</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c30;--card:#17243a;--line:#263750;--text:#e6edf7;--muted:#91a2b8;--cyan:#78d7e8;--red:#f06b79;--yellow:#ffd66b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{display:flex;width:100%;height:100%}.side{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px;gap:12px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}.brand-icon{font-size:24px}.brand h1{font-size:17px;margin:0}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.title{display:flex;justify-content:space-between;align-items:center;color:var(--cyan);font-weight:600;margin-bottom:9px}.title small{color:var(--muted);font-size:11px;font-weight:400}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#101a2a;border-radius:7px;padding:8px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font:13px Consolas,monospace}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{border:1px solid #354a65;border-radius:7px;background:#1c2c43;padding:7px 9px}.btn:hover{border-color:var(--cyan);background:#223a54}.btn.primary{background:#c84f65;border-color:#c84f65}.btn.warn{color:#ff9ba5}.btn:disabled{opacity:.4;cursor:default}.list{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:60px;max-height:27vh}.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:#101a2a;padding:8px;border-radius:7px}.item:hover{border-color:#435875}.item.selected{border-color:var(--yellow);background:#26344a}.swatch{width:12px;height:12px;border-radius:3px;flex:none}.item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-meta{color:var(--muted);font:10px Consolas}.field{display:flex;flex-direction:column;gap:4px;margin:7px 0}.field label{color:var(--muted);font-size:11px}.field input,.field select{width:100%;background:#0e1726;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.note{font-size:11px;color:var(--muted);line-height:1.7}.foot{margin-top:auto;display:flex;gap:8px}.foot .btn{flex:1}.stage{position:relative;flex:1;min-width:0;background:radial-gradient(ellipse at 50% 45%,#1c2a3c,#0b1220 72%)}canvas{display:block;width:100%;height:100%;outline:none}.toolbar{position:absolute;left:16px;top:16px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 32px)}.badge{pointer-events:none;position:absolute;right:16px;top:16px;border:1px solid var(--line);background:#0b1220c9;border-radius:8px;padding:8px 11px;color:#b9c6d6;font-size:12px}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#0b1220c9;border:1px solid var(--line);border-radius:20px;padding:7px 13px;color:#aab8c9;font-size:11px;pointer-events:none}.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#16243a;border:1px solid #39506c;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.empty{color:var(--muted);font-size:12px;padding:8px}
@media(max-width:760px){.side{width:290px;padding:12px}.badge{display:none}.hint{font-size:10px;max-width:90%;white-space:normal;text-align:center}}
</style>
</head>
<body><div class="app">
<aside class="side">
 <div class="brand"><span class="brand-icon">🏭</span><div><h1>库存位置图</h1><small>Three.js · 本地交互演示</small></div></div>
 <section class="card"><div class="title">仓库信息 <small>DEMO · LOCAL</small></div><div class="stats"><div class="stat"><span>仓库尺寸</span><b>30 × 18 m</b></div><div class="stat"><span>网格</span><b>10 × 6</b></div><div class="stat"><span>货物</span><b id="cargoCount">0 件</b></div><div class="stat"><span>障碍物</span><b id="obstacleCount">0 个</b></div></div></section>
 <section class="card"><div class="title">编辑工具</div><div class="tools"><button class="btn primary" id="addCargo">＋ 添加货物</button><button class="btn" id="addObstacle">＋ 添加障碍物</button><button class="btn" id="rotate">↻ 旋转 90°</button><button class="btn warn" id="remove">⌫ 删除选中</button><button class="btn" id="undo">↶ 撤销</button><button class="btn" id="redo">↷ 重做</button></div></section>
 <section class="card"><div class="title">库存货物 <small id="cargoSummary"></small></div><div class="list" id="cargoList"></div></section>
 <section class="card"><div class="title">障碍物 <small id="obstacleSummary"></small></div><div class="list" id="obstacleList"></div></section>
 <section class="card"><div class="title">当前选中 <small id="selectionLabel">未选择</small></div><div class="fields"><div class="field"><label>名称</label><input id="name" disabled></div><div class="field"><label>类型</label><input id="kind" disabled></div><div class="field"><label>长度 (m)</label><input id="length" type="number" step="0.1" disabled></div><div class="field"><label>宽度 (m)</label><input id="width" type="number" step="0.1" disabled></div></div><div class="note">选中后可直接拖动对象；按住 Ctrl / ⌘ 点击可多选。编辑尺寸会立即更新场景。</div></section>
 <div class="foot"><button class="btn" id="resetView">⌂ 重置视角</button><button class="btn" id="resetData">恢复示例数据</button></div>
</aside>
<main class="stage" id="stage"><div class="toolbar"><button class="btn" id="toggleGrid">▦ 网格显示</button><button class="btn" id="deselect">取消选择</button></div><div class="badge">左键拖动物体 · 空白处旋转视角</div><div class="hint">左键拖动物体 · Ctrl/⌘ 多选 · 空白左键旋转 · 右键平移 · 滚轮缩放</div><div class="toast" id="toast"></div></main>
</div>
<script type="module">
import * as THREE from './three/three.module.js';
import { OrbitControls } from './three/controls/OrbitControls.js';

const stage=document.querySelector('#stage');
const scene=new THREE.Scene();scene.background=new THREE.Color('#101a29');scene.fog=new THREE.Fog('#101a29',40,90);
const camera=new THREE.PerspectiveCamera(42,1,.1,180);camera.position.set(27,25,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=12;controls.maxDistance=65;controls.maxPolarAngle=Math.PI*.48;controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
scene.add(new THREE.HemisphereLight(0xd9edff,0x263142,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-12,28,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;scene.add(sun);
const floorGroup=new THREE.Group();scene.add(floorGroup);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,18),new THREE.MeshStandardMaterial({color:'#dce5e8',roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;floor.receiveShadow=true;floorGroup.add(floor);
const grid=new THREE.GridHelper(30,10,'#64859b','#a7b8c1');grid.scale.z=.6;grid.position.y=.006;floorGroup.add(grid);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(30,.12,18)),new THREE.LineBasicMaterial({color:'#56b5c9'}));edges.position.y=.02;floorGroup.add(edges);
const objectsGroup=new THREE.Group();scene.add(objectsGroup);const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const colors=['#e98962','#58a8d8','#79b77d','#bd8bd1','#e0b54f','#5dc4b8'];
const demoData=[
 {id:'c1',name:'SW26-1127',kind:'货物',x:-10,z:-5,w:3.4,d:2.1,h:2.1,color:'#d47c52'},
 {id:'c2',name:'精密零件箱',kind:'货物',x:-5.8,z:-5,w:2.7,d:2.1,h:1.7,color:'#4e9bc5'},
 {id:'c3',name:'液压组件',kind:'货物',x:-2.4,z:-5,w:2.7,d:2.1,h:2.3,color:'#6eaa77'},
 {id:'c4',name:'包装材料',kind:'货物',x:2,z:-5,w:3.4,d:2.1,h:1.5,color:'#d8a844'},
 {id:'c5',name:'出口木箱 A',kind:'货物',x:-10,z:-1.1,w:3.4,d:2.1,h:2.4,color:'#bc7b8b'},
 {id:'c6',name:'电机组件',kind:'货物',x:-5.8,z:-1.1,w:2.7,d:2.1,h:1.9,color:'#708dc1'},
 {id:'c7',name:'仓储货架',kind:'障碍物',x:7.7,z:-1.9,w:1.2,d:9,h:3,color:'#68778a'},
 {id:'c8',name:'立柱 A',kind:'障碍物',x:-13.3,z:5.4,w:.7,d:.7,h:3.8,color:'#daaa58'},
 {id:'c9',name:'立柱 B',kind:'障碍物',x:13.3,z:5.4,w:.7,d:.7,h:3.8,color:'#daaa58'},
];
let items=loadData(),selected=new Set(),drag=null,gridVisible=true,undoStack=[],redoStack=[],dirty=false,toastTimer;
function loadData(){try{const raw=localStorage.getItem('warehouse-3d-demo-data');return raw?JSON.parse(raw):structuredClone(demoData)}catch{return structuredClone(demoData)}}
function snapshot(){return JSON.stringify(items.map(({mesh,...item})=>item))}function saveHistory(){undoStack.push(snapshot());if(undoStack.length>50)undoStack.shift();redoStack=[]}
function notify(text){const node=document.querySelector('#toast');node.textContent=text;node.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('on'),1500)}
function makeObject(item){const geo=new THREE.BoxGeometry(item.w,item.h,item.d);const mat=new THREE.MeshStandardMaterial({color:item.color,roughness:item.kind==='障碍物'?.82:.55,metalness:.04});const mesh=new THREE.Mesh(geo,mat);mesh.position.set(item.x,item.h/2,item.z);mesh.rotation.y=(item.rotation||0)*Math.PI/180;mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData.itemId=item.id;mesh.userData.kind=item.kind;const outline=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:.22}));mesh.add(outline);objectsGroup.add(mesh);item.mesh=mesh;return mesh}
function clearSceneObjects(){while(objectsGroup.children.length){const node=objectsGroup.children[0];objectsGroup.remove(node);node.geometry?.dispose();if(Array.isArray(node.material))node.material.forEach(m=>m.dispose());else node.material?.dispose()}}
function rebuild(){clearSceneObjects();items.forEach(makeObject);renderUI();renderSelection();updateCounts()}
function persist(){localStorage.setItem('warehouse-3d-demo-data',JSON.stringify(items.map(({mesh,...item})=>item)));dirty=true;document.querySelector('.brand small').textContent='Three.js · 本地演示 · 已自动保存'}
function updateCounts(){const cargos=items.filter(i=>i.kind==='货物').length,obs=items.length-cargos;document.querySelector('#cargoCount').textContent=`${cargos} 件`;document.querySelector('#obstacleCount').textContent=`${obs} 个`;document.querySelector('#cargoSummary').textContent=`${cargos} 件`;document.querySelector('#obstacleSummary').textContent=`${obs} 个`}
function renderUI(){for(const [kind,id] of [['货物','#cargoList'],['障碍物','#obstacleList']]){const list=document.querySelector(id);const arr=items.filter(i=>i.kind===kind);list.innerHTML=arr.length?'':'<div class="empty">暂无项目</div>';for(const item of arr){const row=document.createElement('button');row.className='item'+(selected.has(item.id)?' selected':'');row.innerHTML=`<span class="swatch" style="background:${item.color}"></span><span class="item-name"></span><span class="item-meta">${item.w.toFixed(1)}×${item.d.toFixed(1)}m</span>`;row.querySelector('.item-name').textContent=item.name;row.onclick=e=>selectItem(item.id,e.ctrlKey||e.metaKey);list.append(row)}}}
function renderSelection(){const selectedItems=items.filter(i=>selected.has(i.id));const label=document.querySelector('#selectionLabel');label.textContent=selectedItems.length?`${selectedItems.length} 个对象`:'未选择';const [name,kind,length,width]=['#name','#kind','#length','#width'].map(s=>document.querySelector(s));const item=selectedItems.length===1?selectedItems[0]:null;name.disabled=kind.disabled=length.disabled=width.disabled=!item;document.querySelector('#remove').disabled=!selectedItems.length;document.querySelector('#rotate').disabled=!selectedItems.length;if(item){name.value=item.name;kind.value=item.kind;length.value=item.w;width.value=item.d}else{name.value=kind.value=length.value=width.value=''};renderUI();updateHighlight()}
function updateHighlight(){for(const item of items){const mesh=item.mesh;if(!mesh)continue;const active=selected.has(item.id);mesh.material.emissive.set(active?'#26333c':'#000000');mesh.material.emissiveIntensity=active?1:0;mesh.scale.setScalar(active?1.025:1)}}
function selectItem(id,additive=false){if(additive){selected.has(id)?selected.delete(id):selected.add(id)}else if(!selected.has(id)||selected.size!==1){selected.clear();selected.add(id)}renderSelection()}
function updatePointer(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera)}
function hitObject(e){updatePointer(e);return raycaster.intersectObjects(objectsGroup.children,false)[0]?.object||null}
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);function pointOnGround(e){updatePointer(e);const p=new THREE.Vector3();raycaster.ray.intersectPlane(groundPlane,p);return p}
function collides(candidate,ignoreIds){if(candidate.x-candidate.w/2 < -15||candidate.x+candidate.w/2>15||candidate.z-candidate.d/2 < -9||candidate.z+candidate.d/2>9)return true;return items.some(other=>!ignoreIds.has(other.id)&&Math.abs(candidate.x-other.x)<(candidate.w+other.w)/2-.025&&Math.abs(candidate.z-other.z)<(candidate.d+other.d)/2-.025)}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;const hit=hitObject(e);if(!hit){if(!e.ctrlKey&&!e.metaKey){selected.clear();renderSelection()}return}const id=hit.userData.itemId;if(e.ctrlKey||e.metaKey){selectItem(id,true);return}if(!selected.has(id)){selected.clear();selected.add(id);renderSelection()}const p=pointOnGround(e);if(p){saveHistory();drag={pointerId:e.pointerId,start:p,positions:new Map(items.filter(i=>selected.has(i.id)).map(i=>[i.id,{x:i.x,z:i.z}])),changed:false}}renderer.domElement.setPointerCapture(e.pointerId);controls.enabled=false});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const p=pointOnGround(e);if(!p)return;const dx=p.x-drag.start.x,dz=p.z-drag.start.z,ids=new Set(drag.positions.keys()),next=items.filter(i=>ids.has(i.id)).map(i=>({...i,x:drag.positions.get(i.id).x+dx,z:drag.positions.get(i.id).z+dz}));if(next.some(c=>collides(c,ids)))return;next.forEach(c=>{const i=items.find(x=>x.id===c.id);i.x=c.x;i.z=c.z;i.mesh.position.x=i.x;i.mesh.position.z=i.z});drag.changed=Math.abs(dx)+Math.abs(dz)>.01;renderUI()});
function endDrag(){if(!drag)return;const changed=drag.changed;drag=null;controls.enabled=true;if(changed){persist();renderSelection()}}
renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',endDrag);renderer.domElement.addEventListener('lostpointercapture',endDrag);
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function addItem(kind){saveHistory();const idx=items.filter(i=>i.kind===kind).length+1,id=`${kind==='货物'?'cargo':'obstacle'}-${Date.now()}`,isCargo=kind==='货物',item={id,name:isCargo?`新货物 ${idx}`:`新障碍物 ${idx}`,kind,x:isCargo?-2:0,z:3,w:isCargo?2.5:1.2,d:isCargo?1.8:1.2,h:isCargo?1.6:2.5,color:colors[Math.floor(Math.random()*colors.length)]};let tries=0;while(collides(item,new Set())&&tries++<100){item.x=-12+Math.random()*24;item.z=-6+Math.random()*12}items.push(item);selected.clear();selected.add(id);rebuild();persist();notify(`${kind}已添加；可拖动调整位置`)}
function removeSelected(){if(!selected.size)return;saveHistory();items=items.filter(i=>!selected.has(i.id));selected.clear();rebuild();persist();notify('已删除选中对象')}
function rotateSelected(){const targets=items.filter(i=>selected.has(i.id));if(!targets.length)return;saveHistory();const ids=new Set(targets.map(i=>i.id)),anchor=targets[0],before=new Map(targets.map(i=>[i.id,{x:i.x,z:i.z,w:i.w,d:i.d,rotation:i.rotation||0}]));for(const i of targets){const ox=i.x-anchor.x,oz=i.z-anchor.z;i.x=anchor.x-oz;i.z=anchor.z+ox;[i.w,i.d]=[i.d,i.w];i.rotation=((i.rotation||0)+90)%360}if(targets.some(i=>collides(i,ids))){for(const i of targets)Object.assign(i,before.get(i.id));undoStack.pop();notify('旋转后会超出边界或与其它对象重叠');return}rebuild();persist();notify('已旋转 90°')}
function restore(raw){items=JSON.parse(raw);selected.clear();rebuild();persist()}
document.querySelector('#addCargo').onclick=()=>addItem('货物');document.querySelector('#addObstacle').onclick=()=>addItem('障碍物');document.querySelector('#rotate').onclick=rotateSelected;document.querySelector('#remove').onclick=removeSelected;document.querySelector('#deselect').onclick=()=>{selected.clear();renderSelection()};document.querySelector('#toggleGrid').onclick=e=>{gridVisible=!gridVisible;grid.visible=gridVisible;e.currentTarget.classList.toggle('primary',!gridVisible)};
document.querySelector('#undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());notify('已撤销')};document.querySelector('#redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());notify('已重做')};document.querySelector('#resetData').onclick=()=>{if(!confirm('恢复初始示例数据？当前本地编辑内容会被替换。'))return;saveHistory();items=structuredClone(demoData);selected.clear();rebuild();persist();notify('示例数据已恢复')};document.querySelector('#resetView').onclick=()=>{camera.position.set(27,25,30);controls.target.set(0,0,0);controls.update()};document.querySelector('#remove').disabled=true;
document.querySelector('#name').onchange=e=>{const i=items.find(x=>selected.has(x.id));if(i){saveHistory();i.name=e.target.value||i.name;renderUI();persist()}};
for(const [selector,key] of [['#length','w'],['#width','d']])document.querySelector(selector).onchange=e=>{const i=items.find(x=>selected.has(x.id));if(!i)return;const value=Number(e.target.value);if(!(value>0&&value<=15))return notify('尺寸需在 0 到 15 米之间');const c={...i,[key]:value};if(collides(c,new Set([i.id]))){e.target.value=i[key];return notify('尺寸调整后会与边界或其它对象冲突')}saveHistory();i[key]=value;i.mesh.geometry.dispose();i.mesh.geometry=new THREE.BoxGeometry(i.w,i.h,i.d);for(const child of [...i.mesh.children]){i.mesh.remove(child);child.geometry.dispose()}const outline=new THREE.LineSegments(new THREE.EdgesGeometry(i.mesh.geometry),new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:.22}));i.mesh.add(outline);renderUI();persist()};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector(e.shiftKey?'#redo':'#undo').click()}if(e.key==='Escape'){selected.clear();renderSelection()}if(e.key==='Delete'||e.key==='Backspace')removeSelected()});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();rebuild();controls.update();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
