<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>本地待办事项清单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
            dark: '#1f2937',
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .task-transition {
        transition: all 0.3s ease;
      }
      .scale-hover {
        @apply hover:scale-105 transition-transform duration-200;
      }
      .drag-handle {
        cursor: grab;
        @apply opacity-50 hover:opacity-100 transition-opacity;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .date-divider {
        @apply bg-gray-50 text-gray-500 font-medium px-4 py-2 border-y border-gray-200;
      }
      .clock-widget {
        @apply fixed p-4 rounded-lg shadow-lg bg-white z-10 transition-all duration-300;
      }
      .clock-header {
        @apply flex justify-between items-center mb-2;
      }
      .save-status {
        @apply text-xs text-gray-500 ml-2 opacity-0 transition-opacity duration-300;
      }
      .save-status.visible {
        @apply opacity-100;
      }
      .note-text {
        @apply text-gray-500 text-sm mt-1 line-clamp-1;
      }
      .note-expand {
        @apply text-xs text-primary cursor-pointer ml-1;
      }
      .edit-input {
        @apply w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary focus:border-primary outline-none;
      }
      .autosave-widget {
        @apply fixed p-3 rounded-lg shadow-lg bg-white/90 z-40 transition-all duration-300 backdrop-blur-sm;
      }
    }
  </style>

  <style>
    /* 桌面端：隐藏移动端顶栏，主内容为折叠侧边栏留空间 */
    @media screen and (min-width: 769px) {
      #mobile-header { display: none !important; }
      #desktop-sidebar { display: flex !important; }
      .main-content { padding-left: 56px !important; }
    }

    @media screen and (max-width: 768px) {
      #mobile-header { display: block !important; }
      #desktop-sidebar { display: none !important; }
      .main-content { margin-left: 0 !important; padding-top: 72px !important; }
      .clock-widget {
        right: 1rem !important;
        bottom: 1rem !important;
        left: auto !important;
        top: auto !important;
      }
      .autosave-widget {
        right: 1rem !important;
        top: 80px !important;
        left: auto !important;
        bottom: auto !important;
      }
      /* 搜索筛选行 */
      .show-completed-btn { width: 100%; justify-content: center; }
      .show-completed-btn.active { background-color: #3b82f6; color: white; }
      .toggle-drag-btn { width: 100%; justify-content: center; }
      .toggle-drag-btn.active { background-color: #f59e0b; color: white; }
      /* 任务菜单弹出 */
      .task-menu-dropdown { min-width: 140px !important; }
      .task-menu-dropdown button { min-height: 40px; }
      /* 任务操作按钮增大触摸目标 */
      .action-btn { padding: 6px !important; min-width: 40px !important; min-height: 40px !important; display: flex; align-items: center; justify-content: center; }
      /* 确保 hidden 能覆盖拖拽手柄 */
      .drag-handle.hidden { display: none !important; }
      /* 移动端隐藏时钟控件 */
      #clock-widget { display: none !important; }
      /* 备注模态框移动端全宽底部弹出 */
      #note-modal { align-items: flex-end !important; padding: 0 !important; }
      #note-modal > div { max-width: 100% !important; margin: 0 !important; border-radius: 16px 16px 0 0 !important; width: 100% !important; }
      #note-modal .flex.justify-end button { min-height: 48px; padding: 0 24px; font-size: 16px; }
      #note-modal textarea { rows: 6; }
      /* 移动端隐藏导入导出按钮 */
      #export-btn, #save-btn, label[for="import-input"] { display: none !important; }
    }
    .sidebar-item:hover { background-color: #f3f4f6; }
    .sidebar-item.active { background-color: #eff6ff; color: #3b82f6; }
    .sidebar-icon.active { background-color: #eff6ff; color: #3b82f6; }

    /* 触控优化 */
    html { touch-action: manipulation; scrollbar-gutter: stable; }
    @media (max-width: 768px) {
      button, label, a, input[type="checkbox"], select { min-height: 44px; min-width: 44px; }
    }
    @media (hover: hover) {
      .sidebar-item:hover { background-color: #f3f4f6; }
    }
  </style>
</head>

<body class="bg-gray-50 font-inter text-gray-900 min-h-screen flex">
  <!-- 移动端顶部导航 -->
  <header id="mobile-header" class="fixed top-0 left-0 right-0 bg-white shadow-md z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <button id="mobile-menu-btn" class="p-2 -ml-2 text-gray-600">
        <i class="fa fa-bars text-xl"></i>
      </button>
      <span class="text-lg font-bold text-gray-800">待办事项</span>
      <div class="w-10"></div>
    </div>
  </header>

  <!-- 移动端侧边抽屉 -->
  <div id="mobile-drawer" class="fixed inset-0 z-50 hidden">
    <div id="drawer-overlay" class="absolute inset-0 bg-black/50"></div>
    <aside id="drawer-content" class="absolute left-0 top-0 bottom-0 w-64 bg-white shadow-xl transform -translate-x-full transition-transform duration-300">
      <div class="p-4 border-b border-gray-200 flex items-center justify-between">
        <h1 class="text-lg font-bold text-gray-800">物流工具</h1>
        <button id="close-drawer" class="p-2 text-gray-400"><i class="fa fa-times text-xl"></i></button>
      </div>
      <nav class="flex-1 py-4">
        <a href="/" class="sidebar-item active flex items-center gap-3 px-4 py-3 text-gray-700">
          <i class="fa fa-check-square-o w-5"></i><span>待办事项</span>
        </a>
        <a href="/cargo" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-700">
          <i class="fa fa-cubes w-5"></i><span>货物计算</span>
        </a>
        <a href="/posts" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-700">
          <i class="fa fa-instagram w-5"></i><span>微博客</span>
        </a>
      </nav>
      <div class="p-4 border-t border-gray-200 text-xs text-gray-400">
        <p>端口: 5123</p>
      </div>
    </aside>
  </div>
  <!-- 桌面端折叠侧边栏 -->
  <aside id="desktop-sidebar" class="fixed left-0 top-0 bottom-0 w-14 bg-white shadow-lg flex flex-col items-center py-3 z-30">
    <button id="desktop-menu-btn" class="w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors mb-4" title="展开菜单">
      <i class="fa fa-bars text-lg"></i>
    </button>
    <nav class="flex-1 flex flex-col gap-1 py-2">
      <a href="/" class="sidebar-icon active w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors" title="待办事项">
        <i class="fa fa-check-square-o text-lg"></i>
      </a>
      <a href="/cargo" class="sidebar-icon w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors" title="货物计算">
        <i class="fa fa-cubes text-lg"></i>
      </a>
      <a href="/posts" class="sidebar-icon w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors" title="微博客">
        <i class="fa fa-instagram text-lg"></i>
      </a>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content flex-1 container mx-auto px-4 py-8 max-w-3xl">
    <!-- 标题区域 -->
    <header class="mb-8 text-center">
      <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-primary mb-2">待办事项清单</h1>
      <p class="text-gray-600">轻松管理您的日常任务</p>
    </header>

    <!-- 功能控制区 -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-6">
      <!-- 数据导入导出 -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button id="export-btn" class="bg-success hover:bg-success/90 text-white px-3 py-1.5 rounded-lg transition-all scale-hover text-sm flex items-center gap-1">
          <i class="fa fa-download"></i> 导出数据
        </button>
        <label for="import-input" class="bg-primary hover:bg-primary/90 text-white px-3 py-1.5 rounded-lg transition-all scale-hover text-sm flex items-center gap-1 cursor-pointer">
          <i class="fa fa-upload"></i> 导入数据
        </label>
        <input type="file" id="import-input" accept=".json" class="hidden">
        <button id="save-btn" class="bg-dark hover:bg-dark/90 text-white px-3 py-1.5 rounded-lg transition-all scale-hover text-sm flex items-center gap-1">
          <i class="fa fa-save"></i> 手动保存
          <span id="save-status" class="save-status">已保存</span>
        </button>
        <span id="connection-status" class="text-xs text-gray-500 ml-2">
          <i class="fa fa-circle text-success"></i> 已连接
        </span>
      </div>

      <!-- 添加新任务 -->
      <div class="flex gap-2 mb-4">
        <input
          type="text"
          id="new-task-input"
          placeholder="添加新的待办事项..."
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
        >
        <button
          id="add-task-btn"
          class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition-all scale-hover flex items-center gap-1"
        >
          <i class="fa fa-plus"></i> 添加
        </button>
      </div>

      <!-- 搜索和筛选 -->
      <div class="flex flex-col sm:flex-row gap-4">
        <div class="relative flex-1">
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input
            type="text"
            id="search-input"
            placeholder="搜索任务..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
          >
        </div>

        <button
          id="show-completed"
          class="show-completed-btn bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition-all scale-hover text-sm flex items-center gap-1"
        >
          <i class="fa fa-check-circle-o text-primary"></i> 显示已完成
        </button>
        <button
          id="toggle-drag-mode"
          class="toggle-drag-btn bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition-all scale-hover text-sm flex items-center gap-1"
        >
          <i class="fa fa-arrows"></i> 调整位置
        </button>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="bg-white rounded-lg shadow-md">
      <div id="task-list" class="divide-y divide-gray-100">
        <div class="text-center py-12 text-gray-500">
          <i class="fa fa-check-circle-o text-4xl mb-3 opacity-30"></i>
          <p>加载中...</p>
        </div>
      </div>
    </div>

    <!-- 统计信息 -->
    <div class="mt-6 text-center text-gray-600 text-sm">
      <p id="task-stats">待完成: 0 | 已完成: 0 | 总计: 0</p>
    </div>
  </main>

  <!-- 备注详情模态框 -->
  <div id="note-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 m-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-gray-800">任务详情</h3>
        <button id="close-modal" class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">任务标题</label>
        <input type="text" id="modal-task-title" class="edit-input">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">备注内容</label>
        <textarea id="modal-note-content" rows="4" class="edit-input"></textarea>
      </div>
      <div class="flex justify-end gap-2">
        <button id="save-note" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition-all">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 自动保存计时器控件 -->
  <div id="autosave-widget" class="autosave-widget right-4 top-4 w-64 hidden">
    <div class="autosave-header">
      <span class="text-sm font-medium">自动保存</span>
      <button id="cancel-autosave" class="text-gray-400 hover:text-gray-600 text-sm">
        <i class="fa fa-times"></i>
      </button>
    </div>
    <div id="autosave-timer" class="text-center text-sm">
      <p>30秒后自动保存</p>
      <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2">
        <div id="autosave-progress" class="bg-primary h-1.5 rounded-full" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- 悬浮时钟 -->
  <div id="clock-widget" class="clock-widget right-4 bottom-4 w-64">
    <div class="clock-header" id="clock-handle">
      <span class="text-sm font-medium">当前时间</span>
      <button id="toggle-clock" class="text-gray-400 hover:text-gray-600">
        <i class="fa fa-chevron-up"></i>
      </button>
    </div>
    <div id="clock-content" class="text-center">
      <div id="current-date" class="text-lg font-medium"></div>
      <div id="current-time" class="text-3xl font-bold mt-1"></div>
    </div>
  </div>

  <script>
    // API 基础URL
    const API_BASE = '/api/todos';

    // 全局变量
    let tasks = [];
    let renderTasks = null;
    let taskListEl = null;
    let sortable = null;

    // 自动保存计时器
    let autoSaveTimer = null;
    let autoSaveProgress = null;

    // 显示完成状态（从服务器加载）
    let showCompleted = true;
    let dragMode = false;

    // 格式化日期为YYYY-MM-DD
    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    // 获取今天的日期字符串
    function getToday() {
      return formatDate(new Date());
    }

    // API 调用函数
    const API = {
      async getTasks() {
        const res = await fetch(API_BASE);
        return await res.json();
      },

      async addTask(content) {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, date: getToday() })
        });
        return await res.json();
      },

      async updateTask(id, data) {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await res.json();
      },

      async deleteTask(id) {
        const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        return await res.json();
      },

      async reorderTasks(order) {
        await fetch(`${API_BASE}/reorder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order })
        });
      },

      async saveAll(taskList) {
        await fetch(`${API_BASE}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(taskList)
        });
      },

      async exportTasks() {
        return await fetch(`${API_BASE}/export`).then(r => r.json());
      },

      async importTasks(data) {
        const res = await fetch(`${API_BASE}/import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await res.json();
      },

      async getSettings() {
        const res = await fetch(`${API_BASE}/settings`);
        return await res.json();
      },

      async updateSettings(data) {
        const res = await fetch(`${API_BASE}/settings`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await res.json();
      }
    };

    // 自动保存计时器
    function setupAutoSaveTimer() {
      cancelAutoSaveTimer();

      document.getElementById('autosave-widget').classList.remove('hidden');

      let secondsLeft = 30;
      updateTimerDisplay(secondsLeft);

      autoSaveProgress = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay(secondsLeft);
        if (secondsLeft <= 0) {
          clearInterval(autoSaveProgress);
        }
      }, 1000);

      autoSaveTimer = setTimeout(async () => {
        await API.saveAll(tasks);
        showSaveSuccess();
        document.getElementById('autosave-widget').classList.add('hidden');
        clearInterval(autoSaveProgress);
      }, 30000);
    }

    function updateTimerDisplay(seconds) {
      const progress = ((30 - seconds) / 30) * 100;
      document.getElementById('autosave-timer').innerHTML = `
        <p>${seconds}秒后自动保存</p>
        <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2">
          <div id="autosave-progress" class="bg-primary h-1.5 rounded-full" style="width: ${progress}%"></div>
        </div>
      `;
    }

    function cancelAutoSaveTimer() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      if (autoSaveProgress) clearInterval(autoSaveProgress);
      autoSaveTimer = null;
      autoSaveProgress = null;
      document.getElementById('autosave-widget').classList.add('hidden');
    }

    function showSaveSuccess() {
      const widget = document.getElementById('autosave-widget');
      const timerEl = document.getElementById('autosave-timer');
      timerEl.innerHTML = `<p class="text-success font-medium"><i class="fa fa-check-circle"></i> 已保存</p>`;
      setTimeout(() => widget.classList.add('hidden'), 2000);
    }

    function showManualSaveSuccess() {
      const statusEl = document.getElementById('save-status');
      statusEl.textContent = '已保存';
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 2000);
    }

    // 更新统计信息
    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pending = total - completed;
      document.getElementById('task-stats').textContent = `待完成: ${pending} | 已完成: ${completed} | 总计: ${total}`;
    }

    // 获取过滤后的任务并按日期分组
    function getFilteredAndGroupedTasks(searchTerm = '', showCompleted = true) {
      const filtered = tasks.filter(task => {
        const matchesSearch = task.content.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              (task.note && task.note.toLowerCase().includes(searchTerm.toLowerCase()));
        const matchesCompletion = showCompleted || !task.completed;
        return matchesSearch && matchesCompletion;
      });

      const grouped = {};
      filtered.forEach(task => {
        if (!grouped[task.date]) grouped[task.date] = [];
        grouped[task.date].push(task);
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
      return { grouped, sortedDates };
    }

    // 创建任务元素
    function createTaskElement(task) {
      const taskEl = document.createElement('div');
      taskEl.className = `p-4 flex items-start gap-2 task-transition ${task.completed ? 'opacity-70' : ''}`;
      taskEl.dataset.id = task.id;
      taskEl.dataset.date = task.date;

      const bgColors = { white: 'bg-white', danger: 'bg-danger/10', warning: 'bg-warning/10', success: 'bg-success/10', primary: 'bg-primary/10', dark: 'bg-dark/10' };
      taskEl.classList.add(bgColors[task.color] || 'bg-white');

      const colorNames = { white: '默认', danger: '紧急', warning: '重要', success: '完成', primary: '进行中', dark: '长期' };

      let taskHtml = `
        <div class="flex-shrink-0 pt-0.5">
          <input type="checkbox" class="w-5 h-5 rounded-full border-2 border-gray-300 text-primary focus:ring-primary focus:ring-2 transition-all cursor-pointer" ${task.completed ? 'checked' : ''}>
        </div>
        <div class="flex-1 min-w-0">
          <p class="${task.completed ? 'line-through text-gray-500' : 'text-gray-900'} transition-all break-words whitespace-normal">${task.content}</p>
      `;

      if (task.note) {
        const preview = task.note.length > 30 ? task.note.substring(0, 30) + '...' : task.note;
        taskHtml += `<p class="note-text">${preview}<span class="note-expand" data-id="${task.id}">查看</span></p>`;
      }
      taskHtml += `</div>`;

      // 操作菜单按钮 + 弹出面板
      taskHtml += `
        <div class="flex-shrink-0 relative task-menu-wrapper">
          <button class="task-menu-trigger w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors" title="操作">
            <i class="fa fa-ellipsis-v"></i>
          </button>
          <div class="task-menu-dropdown hidden absolute right-0 top-full mt-1 bg-white rounded-lg shadow-lg border border-gray-200 z-20 min-w-[130px]">
            <div class="flex justify-center gap-1.5 p-2 border-b border-gray-100">
              ${['white', 'danger', 'warning', 'success', 'primary', 'dark'].map(color => `
                <button class="color-option w-7 h-7 rounded-full border-2 ${color === 'white' ? 'border-gray-300 bg-white' : `bg-${color}`} ${task.color === color ? 'ring-2 ring-offset-1 ring-primary' : ''} hover:scale-110 transition-transform" data-color="${color}" title="${colorNames[color]}"></button>
              `).join('')}
            </div>
            <button class="menu-edit-btn w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded flex items-center gap-2">
              <i class="fa fa-pencil w-4 text-center"></i> 修改内容
            </button>
            <button class="menu-delete-btn w-full text-left px-3 py-2 text-sm text-danger hover:bg-red-50 rounded flex items-center gap-2">
              <i class="fa fa-trash-o w-4 text-center"></i> 删除
            </button>
          </div>
        </div>
        <div class="drag-handle action-btn text-gray-400 flex-shrink-0 hidden"><i class="fa fa-bars"></i></div>
      `;

      taskEl.innerHTML = taskHtml;
      return taskEl;
    }

    function createDateDivider(date) {
      const divider = document.createElement('div');
      divider.className = 'date-divider';
      const dateObj = new Date(date);
      const today = getToday();
      const yesterday = formatDate(new Date(Date.now() - 86400000));

      let displayText;
      if (date === today) displayText = '今天';
      else if (date === yesterday) displayText = '昨天';
      else displayText = dateObj.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });

      divider.textContent = displayText;
      divider.dataset.date = date;
      return divider;
    }

    function getColorName(color) {
      return { white: '默认', danger: '紧急', warning: '重要', success: '普通', primary: '次要', dark: '长期' }[color] || color;
    }

    // 渲染任务列表
    renderTasks = function() {
      const searchTerm = document.getElementById('search-input').value;
      const { grouped, sortedDates } = getFilteredAndGroupedTasks(searchTerm, showCompleted);

      taskListEl.innerHTML = '';

      if (sortedDates.length === 0) {
        taskListEl.innerHTML = `
          <div class="text-center py-12 text-gray-500">
            <i class="fa fa-check-circle-o text-4xl mb-3 opacity-30"></i>
            <p>${searchTerm ? '没有找到匹配的任务' : '暂无任务，开始添加吧！'}</p>
          </div>
        `;
        return;
      }

      sortedDates.forEach(date => {
        taskListEl.appendChild(createDateDivider(date));
        grouped[date].forEach(task => taskListEl.appendChild(createTaskElement(task)));
      });

      // 恢复拖拽模式下的手柄显示
      if (dragMode) {
        document.querySelectorAll('.drag-handle').forEach(h => h.classList.remove('hidden'));
      }

      try { if (sortable) sortable.destroy(); } catch(e) {}
      sortable = null;
      if (dragMode) {
        sortable = new Sortable(taskListEl, {
          handle: '.drag-handle:not(.hidden)',
          animation: 150,
          filter: '.date-divider',
          onEnd: async function() {
            const taskElements = Array.from(taskListEl.children).filter(el => !el.classList.contains('date-divider'));
            const newOrder = taskElements.map(el => el.dataset.id).filter(Boolean);
            tasks = newOrder.map(id => tasks.find(t => t.id === id)).filter(Boolean);
            await API.reorderTasks(newOrder);
          }
        });
      }
    };

    function initSortable() {
      try { if (sortable) sortable.destroy(); } catch(e) {}
      sortable = null;
      if (!dragMode) return;
      const el = document.getElementById('task-list');
      if (!el) return;
      sortable = new Sortable(el, {
        handle: '.drag-handle:not(.hidden)',
        animation: 150,
        filter: '.date-divider',
        onEnd: async function() {
          const taskElements = Array.from(el.children).filter(el => !el.classList.contains('date-divider'));
          const newOrder = taskElements.map(el => el.dataset.id).filter(Boolean);
          tasks = newOrder.map(id => tasks.find(t => t.id === id)).filter(Boolean);
          await API.reorderTasks(newOrder);
        }
      });
    }

    // 时钟组件
    const ClockWidget = {
      init() {
        const widget = document.getElementById('clock-widget');
        widget.style.top = 'auto';
        widget.style.left = 'auto';
        widget.style.right = '1rem';
        widget.style.bottom = '1rem';
        widget.style.zIndex = '10';

        document.getElementById('toggle-clock').addEventListener('click', () => this.toggleVisibility());
        this.updateTime();
        setInterval(() => this.updateTime(), 1000);
      },
      updateTime() {
        const now = new Date();
        document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      },
      toggleVisibility() {
        const content = document.getElementById('clock-content');
        const btn = document.getElementById('toggle-clock');
        content.style.display = content.style.display === 'none' ? 'block' : 'none';
        btn.innerHTML = content.style.display === 'none' ? '<i class="fa fa-chevron-down"></i>' : '<i class="fa fa-chevron-up"></i>';
      }
    };

    // 自动保存控件
    const AutoSaveWidget = {
      init() {
        const widget = document.getElementById('autosave-widget');
        widget.style.top = '1rem';
        widget.style.left = 'auto';
        widget.style.right = '1rem';
        widget.style.bottom = 'auto';
        widget.style.zIndex = '10';

        document.getElementById('cancel-autosave').addEventListener('click', () => cancelAutoSaveTimer());
      }
    };

    // 备注模态框
    const NoteModal = {
      originalContent: { title: '', note: '' },
      init() {
        document.getElementById('close-modal').addEventListener('click', () => this.hide());
        document.getElementById('note-modal').addEventListener('click', (e) => { if (e.target.id === 'note-modal') this.hideWithCheck(); });
        document.getElementById('save-note').addEventListener('click', () => this.saveNote());
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('note-modal').classList.contains('hidden')) this.hideWithCheck(); });
      },
      show(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          this.currentTaskId = taskId;
          document.getElementById('modal-task-title').value = task.content;
          document.getElementById('modal-note-content').value = task.note || '';
          // 保存原始内容
          this.originalContent = { title: task.content, note: task.note || '' };
          document.getElementById('note-modal').classList.remove('hidden');
          setTimeout(() => document.getElementById('modal-task-title').focus(), 300);
        }
      },
      isContentChanged() {
        const currentTitle = document.getElementById('modal-task-title').value;
        const currentNote = document.getElementById('modal-note-content').value;
        return currentTitle !== this.originalContent.title || currentNote !== this.originalContent.note;
      },
      hideWithCheck() {
        if (this.isContentChanged()) {
          if (confirm('修改内容尚未保存，确定要关闭吗？')) {
            this.hide();
          }
        } else {
          this.hide();
        }
      },
      hide() {
        document.getElementById('note-modal').classList.add('hidden');
        this.currentTaskId = null;
        this.originalContent = { title: '', note: '' };
      },
      async saveNote() {
        if (!this.currentTaskId) return;
        const content = document.getElementById('modal-task-title').value.trim();
        const note = document.getElementById('modal-note-content').value.trim();
        if (!content) { alert('任务标题不能为空'); return; }

        await API.updateTask(this.currentTaskId, { content, note });
        const task = tasks.find(t => t.id === this.currentTaskId);
        if (task) { task.content = content; task.note = note; }
        renderTasks();
        this.hide();
      }
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      // 加载数据
      try {
        tasks = await API.getTasks();
      } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('task-list').innerHTML = '<div class="text-center py-12 text-red-500"><i class="fa fa-exclamation-triangle text-4xl mb-3"></i><p>服务器连接失败，请确保服务已启动</p></div>';
        document.getElementById('connection-status').innerHTML = '<i class="fa fa-circle text-danger"></i> 未连接';
      }

      ClockWidget.init();
      AutoSaveWidget.init();
      NoteModal.init();

      taskListEl = document.getElementById('task-list');
      const newTaskInput = document.getElementById('new-task-input');
      const addTaskBtn = document.getElementById('add-task-btn');
      const showCompletedBtn = document.getElementById('show-completed');

      // 显示/隐藏已完成
      showCompletedBtn.addEventListener('click', () => {
        showCompletedBtn.classList.toggle('active');
        showCompleted = showCompletedBtn.classList.contains('active');
        showCompletedBtn.innerHTML = showCompleted ?
          '<i class="fa fa-check-circle-o text-white"></i> 隐藏已完成' :
          '<i class="fa fa-check-circle-o text-primary"></i> 显示已完成';
        renderTasks();
        // 保存设置
        API.updateSettings({ showCompleted });
      });

      // 调整位置开关
      const dragModeBtn = document.getElementById('toggle-drag-mode');
      dragModeBtn.addEventListener('click', () => {
        dragMode = !dragMode;
        dragModeBtn.classList.toggle('active', dragMode);
        dragModeBtn.innerHTML = dragMode ?
          '<i class="fa fa-arrows text-white"></i> 关闭调整' :
          '<i class="fa fa-arrows"></i> 调整位置';
        // 显示/隐藏所有拖拽手柄
        document.querySelectorAll('.drag-handle').forEach(h => {
          h.classList.toggle('hidden', !dragMode);
        });
        initSortable();
      });

      // 加载设置，恢复显示状态
      try {
        const settings = await API.getSettings();
        showCompleted = settings.showCompleted !== false; // 默认为true
        if (showCompleted) {
          showCompletedBtn.classList.add('active');
          showCompletedBtn.innerHTML = '<i class="fa fa-check-circle-o text-white"></i> 隐藏已完成';
        } else {
          showCompletedBtn.classList.remove('active');
          showCompletedBtn.innerHTML = '<i class="fa fa-check-circle-o text-primary"></i> 显示已完成';
        }
      } catch (e) {
        // 默认显示已完成
        showCompletedBtn.classList.add('active');
        showCompletedBtn.innerHTML = '<i class="fa fa-check-circle-o text-white"></i> 隐藏已完成';
        showCompleted = true;
      }

      // 添加任务
      async function addNewTask() {
        const content = newTaskInput.value.trim();
        if (!content) return;

        const task = await API.addTask(content);
        tasks.unshift(task);
        newTaskInput.value = '';
        renderTasks();

        const firstTask = taskListEl.querySelector('[data-id]');
        if (firstTask) {
          firstTask.classList.add('bg-primary/20');
          setTimeout(() => firstTask.classList.remove('bg-primary/20'), 500);
        }
      }

      addTaskBtn.addEventListener('click', addNewTask);
      newTaskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewTask(); });
      document.getElementById('search-input').addEventListener('input', renderTasks);

      // 导出
      document.getElementById('export-btn').addEventListener('click', async () => {
        const data = await API.exportTasks();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${getToday()}_todolist_data.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // 导入
      document.getElementById('import-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.name.endsWith('.json')) { alert('请选择JSON格式的文件'); return; }

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            await API.importTasks(data);
            tasks = await API.getTasks();
            renderTasks();
            alert('数据导入成功');
          } catch (err) { alert('导入失败：' + err.message); }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // 手动保存
      document.getElementById('save-btn').addEventListener('click', async () => {
        await API.saveAll(tasks);
        showManualSaveSuccess();
      });

      // 全局点击关闭任务菜单
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.task-menu-wrapper')) {
          document.querySelectorAll('.task-menu-dropdown').forEach(d => d.classList.add('hidden'));
        }
      });

      // 任务列表点击
      taskListEl.addEventListener('click', async (e) => {
        // 操作菜单触发器 — 切换弹出
        if (e.target.closest('.task-menu-trigger')) {
          e.stopPropagation();
          const wrapper = e.target.closest('.task-menu-wrapper');
          const dropdown = wrapper.querySelector('.task-menu-dropdown');
          document.querySelectorAll('.task-menu-dropdown').forEach(d => { if (d !== dropdown) d.classList.add('hidden'); });
          dropdown.classList.toggle('hidden');
          return;
        }

        const taskEl = e.target.closest('[data-id]');
        if (!taskEl) return;
        const taskId = taskEl.dataset.id;

        if (e.target.type === 'checkbox') {
          const task = tasks.find(t => t.id === taskId);
          if (task) {
            task.completed = !task.completed;
            await API.updateTask(taskId, { completed: task.completed });
            renderTasks();
          }
        }

        if (e.target.dataset.color) {
          const task = tasks.find(t => t.id === taskId);
          if (task) {
            task.color = e.target.dataset.color;
            await API.updateTask(taskId, { color: task.color });
            // 直接更新当前任务元素背景色，保持菜单打开
            const bgColors = { white: 'bg-white', danger: 'bg-danger/10', warning: 'bg-warning/10', success: 'bg-success/10', primary: 'bg-primary/10', dark: 'bg-dark/10' };
            Object.values(bgColors).forEach(c => taskEl.classList.remove(c));
            taskEl.classList.add(bgColors[task.color] || 'bg-white');
            // 更新颜色选项的选中环
            const dropdown = e.target.closest('.task-menu-dropdown');
            dropdown.querySelectorAll('.color-option').forEach(btn => {
              btn.classList.toggle('ring-2', btn.dataset.color === task.color);
              btn.classList.toggle('ring-offset-1', btn.dataset.color === task.color);
              btn.classList.toggle('ring-primary', btn.dataset.color === task.color);
            });
          }
        }

        // 菜单中的"修改内容"
        if (e.target.closest('.menu-edit-btn')) {
          e.target.closest('.task-menu-dropdown')?.classList.add('hidden');
          NoteModal.show(taskId);
        }

        // 菜单中的"删除"
        if (e.target.closest('.menu-delete-btn')) {
          e.target.closest('.task-menu-dropdown')?.classList.add('hidden');
          if (confirm('确定要删除这个任务吗？')) {
            taskEl.classList.add('scale-95', 'opacity-0');
            setTimeout(async () => {
              await API.deleteTask(taskId);
              tasks = tasks.filter(t => t.id !== taskId);
              renderTasks();
            }, 200);
          }
        }

        if (e.target.classList.contains('note-expand')) {
          NoteModal.show(taskId);
        }
      });

      updateStats();
      renderTasks();
    });

    // 移动端导航
    function preventScroll(e) { e.preventDefault(); }
    function initMobileNav() {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('drawer-overlay');
      const drawerContent = document.getElementById('drawer-content');
      const closeBtn = document.getElementById('close-drawer');

      function openDrawer() {
        drawer.classList.remove('hidden');
        requestAnimationFrame(() => drawerContent.classList.remove('-translate-x-full'));
        document.body.style.overflow = 'hidden';
        document.addEventListener('touchmove', preventScroll, { passive: false });
      }
      function closeDrawer() {
        drawerContent.classList.add('-translate-x-full');
        setTimeout(() => drawer.classList.add('hidden'), 300);
        document.body.style.overflow = '';
        document.removeEventListener('touchmove', preventScroll);
      }

      const desktopMenuBtn = document.getElementById('desktop-menu-btn');
      menuBtn?.addEventListener('click', openDrawer);
      desktopMenuBtn?.addEventListener('click', openDrawer);
      overlay?.addEventListener('click', closeDrawer);
      closeBtn?.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    }
    initMobileNav();
  </script>
</body>
</html>
