<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>装柜图 - B（编号清单）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 20px 30px 50px; }
  h1 { font-size: 19px; color: #ffd93d; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8899aa; margin-bottom: 16px; line-height: 1.8; }
  .card { background: #16213e; border: 1px solid #2a2a5e; border-radius: 12px; padding: 16px 20px; }
  canvas { display: block; background: #fff; border-radius: 6px; max-width: 100%; height: auto; cursor: crosshair; }
  .legend { font-size: 12px; color: #ccc; margin: 10px 0 0; display: flex; gap: 20px; flex-wrap: wrap; }
  .legend b { font-weight: 600; }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  .btn { background: #0f3460; color: #ccc; border: none; padding: 6px 18px; border-radius: 16px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #1a4a7a; color: #fff; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #ff6b81; }
</style>
</head>
<body>
<h1>📦 装柜图 - B（等轴测 · 编号徽标 + 货物清单）</h1>
<div class="sub" id="subInfo">加载数据中…</div>

<div class="card">
  <canvas id="cv" width="1650" height="1050"></canvas>
  <div class="legend">
    <span><b style="color:#c62828">●</b> 编号徽标</span>
    <span><b style="color:#c62828">▲叠放</b> = 堆叠　<b style="color:#b26a00">⚠悬空</b> = 悬空</span>
    <span>🖱 悬停徽标或清单行 → 双向高亮</span>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="dl()">⬇ 下载图片</button>
    <button class="btn" onclick="goBack()">← 返回编辑器</button>
  </div>
</div>

<script>
// ============================================================
//  数据加载：优先取编辑器存下的当前布局，否则内置演示数据（id=3）
// ============================================================
const DEMO_CONTAINER = { name: '40尺高柜', l: 12030, w: 2350, h: 2690 };
const DEMO_CARGOS = [
  { name: 'ESS250B主机222', sx: 1390, sy: 1550, sz: 840,  px: 7370, py: 0,   pz: 0,    color: '#e94560' },
  { name: 'ESS250B尾架',    sx: 2500, sy: 300,  sz: 640,  px: 7110, py: 630, pz: 1050, color: '#ff6b6b' },
  { name: 'ESS450B主机',    sx: 1590, sy: 1570, sz: 1040, px: 5520, py: 0,   pz: 1310, color: '#ffa94d' },
  { name: 'ESS450B尾架',    sx: 2500, sy: 300,  sz: 640,  px: 7110, py: 330, pz: 1050, color: '#ffd93d' },
  { name: 'SZ750W主机',     sx: 2170, sy: 1570, sz: 1350, px: 0,    py: 0,   pz: 950,  color: '#6bcb77' },
  { name: 'SZ750W尾架',     sx: 3430, sy: 330,  sz: 1100, px: 8600, py: 0,   pz: 1250, color: '#4d96ff' },
  { name: '东鹏制氮机',     sx: 1500, sy: 2250, sz: 1310, px: 4220, py: 0,   pz: 0,    color: '#845ef7' },
  { name: '东鹏空压机',     sx: 1000, sy: 1250, sz: 1300, px: 5720, py: 0,   pz: 0,    color: '#cc5de8' },
  { name: '升奥注芯机',     sx: 2580, sy: 1510, sz: 950,  px: 0,    py: 0,   pz: 0,    color: '#20c997' },
  { name: '顺意达包馅机',   sx: 1300, sy: 1750, sz: 1000, px: 4220, py: 0,   pz: 1310, color: '#ff922b' },
  { name: '顺意达打饼机',   sx: 650,  sy: 1480, sz: 1050, px: 6720, py: 0,   pz: 0,    color: '#339af0' },
  { name: '顺意达立式排盘机', sx: 1640, sy: 1950, sz: 1730, px: 2580, py: 0, pz: 0,  color: '#f06595' },
];

let CONTAINER, CARGOS, planName;
try {
  const raw = localStorage.getItem('container_layout_preview_b');
  if (raw) {
    const saved = JSON.parse(raw);
    const d = saved.data;
    if (d && d.container && Array.isArray(d.cargos)) {
      CONTAINER = { name: d.container.name || '货柜', l: d.container.l, w: d.container.w, h: d.container.h };
      CARGOS = d.cargos.map(c => ({
        name: c.name, sx: c.sx, sy: c.sy, sz: c.sz,
        px: c.px, py: c.py, pz: c.pz, color: c.color || '#e94560',
      }));
      planName = saved.name || '';
    }
  }
} catch (e) { console.warn('[preview-b] 读取布局数据失败，使用演示数据:', e); }
if (!CONTAINER) { CONTAINER = DEMO_CONTAINER; CARGOS = DEMO_CARGOS; planName = '（演示数据 id=3）'; }
document.getElementById('subInfo').innerHTML =
  `方案：<b>${planName}</b> · 货柜：${CONTAINER.name} ${CONTAINER.l}×${CONTAINER.w}×${CONTAINER.h}mm · ${CARGOS.length} 件货`;

// ============================================================
//  堆叠 / 悬空检测
// ============================================================
function detectStacking(cargos) {
  return cargos.map((a, i) => {
    const st = { stacked: false, suspended: false, on: [] };
    if (a.py > 1) {
      for (let j = 0; j < cargos.length; j++) {
        if (i === j) continue;
        const b = cargos[j];
        if (Math.abs(a.py - (b.py + b.sy)) > 1) continue;
        const ox = Math.max(0, Math.min(a.px + a.sx, b.px + b.sx) - Math.max(a.px, b.px));
        const oz = Math.max(0, Math.min(a.pz + a.sz, b.pz + b.sz) - Math.max(a.pz, b.pz));
        if (ox > 1 && oz > 1) { st.stacked = true; st.on.push(j); }
      }
      if (!st.stacked) st.suspended = true;
    }
    return st;
  });
}
const STACK = detectStacking(CARGOS);
const hexRgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
// 带圈数字（序号显示）
const CIRC_NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
const circNum = n => CIRC_NUM[n - 1] || n;

// 装柜图序号：以原点为基准，排优先 + 排内右边优先。
// 排 = x 方向相近（差 ≤500mm）的货物归为同一排，排按 x 增序；排内按 z 0→max（z 小=屏幕右侧先编号）、y 0→max、x 0→max。
// 效果：左右相邻货物按"右1左2右3左4"顺序编号，而不是右边整列编完再编左边
const ROW_TOL = 500;   // 同排判定容差（mm）
const xSorted = CARGOS.map((c, i) => i).sort((a, b) => CARGOS[a].px - CARGOS[b].px);
const rowOf = new Array(CARGOS.length);
let rowNo = 0, lastRowX = -Infinity;
for (const i of xSorted) {
  if (CARGOS[i].px - lastRowX > ROW_TOL) rowNo++;
  rowOf[i] = rowNo;
  lastRowX = CARGOS[i].px;
}
const SORT_INDEX = CARGOS.map((c, i) => i)
  .sort((a, b) => rowOf[a] - rowOf[b] || CARGOS[a].pz - CARGOS[b].pz || CARGOS[a].py - CARGOS[b].py || CARGOS[a].px - CARGOS[b].px);
const dispPos = new Array(CARGOS.length);   // 原索引 → 显示序号位置（0-based）
SORT_INDEX.forEach((orig, pos) => { dispPos[orig] = pos; });

// ============================================================
//  投影：左侧柜体 + 右侧清单
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const cos30 = 0.8660, sin30 = 0.5;
const LIST_W = 600, LIST_X = W - LIST_W + 10;
const { l, w, h } = CONTAINER;
const corners = [[0,0,0],[l,0,0],[l,0,w],[0,0,w],[0,h,0],[l,h,0],[l,h,w],[0,h,w]];
const raw = corners.map(([x, y, z]) => [(x - z) * cos30, (x + z) * sin30 - y]);
const xs = raw.map(p => p[0]), ys = raw.map(p => p[1]);
const S = Math.min((W - LIST_W - 110) / (Math.max(...xs) - Math.min(...xs)),
                   (H - 110) / (Math.max(...ys) - Math.min(...ys)));
const ox = (W - LIST_W) / 2 - (Math.min(...xs) + Math.max(...xs)) / 2 * S;
const oy = (H - 90) / 2 + 45 - (Math.min(...ys) + Math.max(...ys)) / 2 * S;
const proj = (x, y, z) => [ox + (x - z) * cos30 * S, oy + (x + z) * sin30 * S - y * S];
const topPts = CARGOS.map(c => {
  const p0 = proj(c.px, c.py + c.sy, c.pz), p1 = proj(c.px + c.sx, c.py + c.sy, c.pz),
        p2 = proj(c.px + c.sx, c.py + c.sy, c.pz + c.sz), p3 = proj(c.px, c.py + c.sy, c.pz + c.sz);
  return { poly: [p0, p1, p2, p3], center: proj(c.px + c.sx / 2, c.py + c.sy, c.pz + c.sz / 2) };
});

// 编号徽标错开布局：初始在各自货物顶面中心，重叠时互相推开（限制偏移半径 70px），无碰撞才回拉锚点
const BADGE_R = 18;   // 碰撞半径（含 hover 放大）
const badges = CARGOS.map((c, i) => {
  const [bx, by] = topPts[i].center;
  return { i, x: bx, y: by, ax: bx, ay: by };
});
for (let iter = 0; iter < 90; iter++) {
  let moved = false;
  for (let a = 0; a < badges.length; a++) for (let b = a + 1; b < badges.length; b++) {
    const A = badges[a], B = badges[b];
    const dx = B.x - A.x, dy = B.y - A.y;
    const dist = Math.hypot(dx, dy);
    const minD = BADGE_R * 2 + 2;
    if (dist > 0.001 && dist < minD) {
      moved = true;
      const push = (minD - dist) / 2;
      const ux = dx / dist, uy = dy / dist;
      // 货物小的多让位（按体积权重）
      const volA = CARGOS[A.i].sx * CARGOS[A.i].sy * CARGOS[A.i].sz;
      const volB = CARGOS[B.i].sx * CARGOS[B.i].sy * CARGOS[B.i].sz;
      const wA = volB / (volA + volB);
      A.x -= ux * push * wA; A.y -= uy * push * wA;
      B.x += ux * push * (1 - wA); B.y += uy * push * (1 - wA);
    }
  }
  for (const Bd of badges) {
    let collides = false;
    for (const O of badges) {
      if (O !== Bd && Math.hypot(O.x - Bd.x, O.y - Bd.y) < BADGE_R * 2 + 2) { collides = true; break; }
    }
    if (!collides) { Bd.x += (Bd.ax - Bd.x) * 0.15; Bd.y += (Bd.ay - Bd.y) * 0.15; }
    // 限幅：离锚点不超过 70px
    const dx = Bd.x - Bd.ax, dy = Bd.y - Bd.ay, d = Math.hypot(dx, dy);
    if (d > 70) { Bd.x = Bd.ax + dx / d * 70; Bd.y = Bd.ay + dy / d * 70; }
  }
  if (!moved) break;
}

// ============================================================
//  绘制
// ============================================================
let hoverIdx = -1;
const rowH = 40, headY = 92;
const quad = (pts, fill, stroke, lw, dash) => {
  ctx.save();
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1;
  ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
};

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  // 标题：内容片段（方案名/货柜信息/件数）加圆角底色胶囊便于观察
  ctx.font = 'bold 18px "Segoe UI","PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let tx = 26;
  const ty = 25;
  const drawSeg = (txt, color) => {
    ctx.fillStyle = color;
    ctx.fillText(txt, tx, ty);
    tx += ctx.measureText(txt).width;
  };
  const drawPill = (txt) => {
    const w = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(43,108,176,0.14)';
    ctx.beginPath(); ctx.roundRect(tx, ty - 15, w + 14, 26, 13); ctx.fill();
    ctx.fillStyle = '#1a3a5c';
    ctx.fillText(txt, tx + 7, ty);
    tx += w + 21;
  };
  drawSeg('方案：', '#1a3a5c');
  drawPill(planName);
  drawSeg(' · 货柜：', '#1a3a5c');
  drawPill(`${CONTAINER.name} ${l}×${w}×${h}mm`);
  drawSeg(' · ', '#1a3a5c');
  drawPill(`${CARGOS.length}件货`);


  // 地面网格
  const gxStep = l > 8000 ? 1000 : 500, gzStep = w > 2000 ? 500 : 250;
  ctx.save(); ctx.strokeStyle = 'rgba(120,140,170,0.3)'; ctx.lineWidth = 0.6;
  for (let gx = 0; gx <= l; gx += gxStep) { ctx.beginPath(); ctx.moveTo(...proj(gx, 0, 0)); ctx.lineTo(...proj(gx, 0, w)); ctx.stroke(); }
  for (let gz = 0; gz <= w; gz += gzStep) { ctx.beginPath(); ctx.moveTo(...proj(0, 0, gz)); ctx.lineTo(...proj(l, 0, gz)); ctx.stroke(); }
  ctx.restore();

  // 柜体
  quad([proj(0,0,0), proj(l,0,0), proj(l,0,w), proj(0,0,w)], 'rgba(43,108,176,0.07)', 'rgba(43,108,176,0.9)', 2.5);
  ctx.save(); ctx.strokeStyle = 'rgba(43,108,176,0.45)'; ctx.lineWidth = 1.1; ctx.setLineDash([6, 5]);
  for (const [a, b] of [[0,4],[1,5],[2,6],[3,7],[4,5],[5,6],[6,7],[7,4]]) {
    ctx.beginPath(); ctx.moveTo(...proj(...corners[a])); ctx.lineTo(...proj(...corners[b])); ctx.stroke();
  }
  ctx.restore();

  // 底部投影 + 悬空垂落线
  CARGOS.forEach((c, i) => {
    quad([proj(c.px,0,c.pz), proj(c.px+c.sx,0,c.pz), proj(c.px+c.sx,0,c.pz+c.sz), proj(c.px,0,c.pz+c.sz)], 'rgba(0,0,0,0.10)', 'rgba(0,0,0,0.22)', 0.8);
    if (STACK[i].suspended) {
      ctx.save(); ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(...proj(c.px+c.sx/2, 0, c.pz+c.sz/2)); ctx.lineTo(...proj(c.px+c.sx/2, c.py, c.pz+c.sz/2)); ctx.stroke();
      ctx.restore();
    }
  });

  // 货物
  const order = CARGOS.map((c, i) => i).sort((a, b) => (CARGOS[a].px + CARGOS[a].py + CARGOS[a].pz) - (CARGOS[b].px + CARGOS[b].py + CARGOS[b].pz));
  for (const i of order) {
    const c = CARGOS[i]; const st = STACK[i];
    const isHover = hoverIdx === i;
    const [x0, y0, z0] = [c.px, c.py, c.pz];
    const p = (dx, dy, dz) => proj(x0 + dx, y0 + dy, z0 + dz);
    const alpha = isHover ? 1 : 0.66;
    const edgeW = st.stacked ? 2.5 : 1.1;
    quad([p(c.sx,0,0), p(c.sx,0,c.sz), p(c.sx,c.sy,c.sz), p(c.sx,c.sy,0)], hexRgba(c.color, 0.5 * alpha), 'rgba(0,0,0,0.45)', edgeW);
    quad([p(0,0,c.sz), p(c.sx,0,c.sz), p(c.sx,c.sy,c.sz), p(0,c.sy,c.sz)], hexRgba(c.color, 0.72 * alpha), 'rgba(0,0,0,0.45)', edgeW);
    quad([p(0,c.sy,0), p(c.sx,c.sy,0), p(c.sx,c.sy,c.sz), p(0,c.sy,c.sz)], hexRgba(c.color, 0.95 * alpha),
         st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : 'rgba(0,0,0,0.55)'), edgeW + 0.6, st.suspended ? [4,3] : null);
  }

  // 编号徽标置顶：在所有货物绘制完成后统一绘制（错开布局位置），保证不被货物遮挡；
  // 序号按 x→z→y 排序后的编号（pos+1）
  for (let pos = 0; pos < SORT_INDEX.length; pos++) {
    const i = SORT_INDEX[pos];
    const st = STACK[i];
    const isHover = hoverIdx === i;
    const bx = badges[i].x, by = badges[i].y;
    const r = isHover ? 17 : 14;
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    ctx.strokeStyle = isHover ? '#e94560' : (st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : '#2b6cb0'));
    ctx.lineWidth = isHover ? 3 : 2; ctx.stroke();
    ctx.fillStyle = '#1a1a1a'; ctx.font = `bold ${r + 4}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pos + 1, bx, by + 1);
    ctx.restore();
  }

  // 侧边清单（放大 1.5 倍：行高 40、字号 16-18px；序号列压缩、名称列加宽；浅框线 + 表格外框）
  ctx.fillStyle = '#1a3a5c'; ctx.font = 'bold 16px "Segoe UI","PingFang SC",sans-serif';
  ctx.fillText('货物清单', LIST_X, 38);
  // 表格外框（浅色）
  const tblX = LIST_X - 8, tblY = headY - 28;
  const tblW = 608, tblH = headY + 10 + CARGOS.length * rowH + 10 - tblY;
  ctx.strokeStyle = 'rgba(138,160,184,0.55)'; ctx.lineWidth = 1;
  ctx.strokeRect(tblX, tblY, tblW, tblH);
  // 表头
  const numCx = LIST_X + 30;                 // 序号列（压缩：仅徽标宽）
  const cols = [LIST_X + 62, LIST_X + 330, LIST_X + 480];
  ctx.fillStyle = '#888'; ctx.font = '15px sans-serif';
  ctx.fillText('序号', numCx - 12, headY - 12);
  ctx.fillText('货物名称', cols[0], headY - 12);
  ctx.fillText('尺寸(mm)', cols[1], headY - 12);
  ctx.fillText('状态', cols[2], headY - 12);
  ctx.strokeStyle = '#8aa0b8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(LIST_X - 4, headY - 4); ctx.lineTo(LIST_X + 596, headY - 4); ctx.stroke();

  // 清单行按 x→z→y 排序后的顺序渲染（序号 = 排序位置+1）
  SORT_INDEX.forEach((i, pos) => {
    const c = CARGOS[i];
    const st = STACK[i];
    const isHover = hoverIdx === i;
    const y = headY + 12 + pos * rowH;
    const yc = y + rowH / 2;               // 行垂直中心（内容整体居中）
    if (isHover) {
      ctx.fillStyle = 'rgba(233,69,96,0.10)';
      ctx.fillRect(LIST_X - 4, y, 596, rowH - 2);
    }
    // 行分隔浅框线（贴行底）
    ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(LIST_X, y + rowH - 2); ctx.lineTo(LIST_X + 592, y + rowH - 2); ctx.stroke();
    // 序号徽标（置顶颜色规则与图上一致，垂直居中）
    ctx.save();
    ctx.beginPath(); ctx.arc(numCx, yc, 13, 0, Math.PI * 2);
    ctx.fillStyle = st.stacked ? '#ffebee' : (st.suspended ? '#fff8e1' : '#f0f4f8'); ctx.fill();
    ctx.strokeStyle = st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : '#8aa0b8'); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pos + 1, numCx, yc);
    ctx.restore();
    // 名称（列宽 268px，超长截断，基线按居中调整）
    ctx.fillStyle = '#1a1a1a'; ctx.font = '18px "Segoe UI","PingFang SC",sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(c.name.length > 12 ? c.name.slice(0, 12) + '…' : c.name, cols[0], yc + 6);
    // 尺寸
    ctx.fillStyle = '#555'; ctx.font = '16px Consolas,monospace';
    ctx.fillText(c.sx + '×' + c.sz + '×' + c.sy, cols[1], yc + 6);
    // 状态（叠放标注支撑物带圈序号：▲ 叠于④ 上）
    ctx.font = '18px sans-serif';
    if (st.stacked) {
      ctx.fillStyle = '#c62828';
      ctx.fillText('▲ 叠于' + st.on.map(j => circNum(dispPos[j] + 1)).join('、') + ' 上', cols[2], yc + 6);
    }
    else if (st.suspended) { ctx.fillStyle = '#b26a00'; ctx.fillText('⚠悬空', cols[2], yc + 6); }
    else { ctx.fillStyle = '#999'; ctx.fillText('—', cols[2], yc + 6); }
  });

  // 堆叠/悬空详情：置于货物表格下方，货物名称加圆角底色便于读取
  let detailY = tblY + tblH + 34;
  ctx.font = 'bold 15px "Segoe UI","PingFang SC",sans-serif';
  ctx.textBaseline = 'middle';
  SORT_INDEX.forEach((i) => {
    const c = CARGOS[i];
    const st = STACK[i];
    let segX = 0;
    const drawSeg = (txt, color) => {           // 普通文字段
      ctx.fillStyle = color;
      ctx.fillText(txt, LIST_X + segX, detailY);
      segX += ctx.measureText(txt).width;
    };
    const drawPill = (txt, color) => {          // 名称胶囊（圆角底色）
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(LIST_X + segX, detailY - 13, w + 12, 22, 10); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.fillText(txt, LIST_X + segX + 6, detailY);
      segX += w + 20;
    };
    if (st.stacked) {
      drawSeg(circNum(dispPos[i] + 1) + '号 ', '#c62828');
      drawPill(c.name, 'rgba(198,40,40,0.13)');
      drawSeg(' ▲叠放于 ', '#c62828');
      st.on.forEach((j, k) => {
        if (k > 0) drawSeg('、', '#c62828');
        drawSeg(circNum(dispPos[j] + 1) + '号 ', '#c62828');
        drawPill(CARGOS[j].name, 'rgba(198,40,40,0.13)');
      });
      drawSeg(' 上', '#c62828');
      detailY += 30;
    } else if (st.suspended) {
      drawSeg(circNum(dispPos[i] + 1) + '号 ', '#b26a00');
      drawPill(c.name, 'rgba(178,106,0,0.14)');
      drawSeg(` ⚠ 悬空${c.py}mm 需支撑`, '#b26a00');
      detailY += 30;
    }
  });

  // 左下角俯视图（平面布置，带圈序号；重叠时按层错开并加 -1/-2 层标）
  // 参数与 A 方案完全一致，保证两方案俯视图编号展示统一
  const vw = 470, vh = 96;
  const vx = 24, vy = H - vh - 52;
  ctx.fillStyle = '#1a3a5c'; ctx.font = 'bold 18px "Segoe UI","PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('俯视图（平面布置）', vx, vy - 10);
  ctx.fillStyle = '#f7f9fc'; ctx.fillRect(vx, vy, vw, vh);
  ctx.strokeStyle = '#2b6cb0'; ctx.lineWidth = 1.2; ctx.strokeRect(vx, vy, vw, vh);
  const vSX = vw / l, vSY = vh / w;
  for (let i = 0; i < CARGOS.length; i++) {
    const c = CARGOS[i]; const st = STACK[i];
    const rx = vx + c.px * vSX, ry = vy + c.pz * vSY, rw = c.sx * vSX, rh = c.sz * vSY;
    if (rw < 2 || rh < 2) continue;
    ctx.fillStyle = hexRgba(c.color, 0.5); ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeStyle = st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : 'rgba(0,0,0,0.4)');
    ctx.lineWidth = st.stacked ? 1.4 : 0.7;
    ctx.strokeRect(rx, ry, rw, rh);
  }
  // 序号标注：带圈数字；重叠货物按底面高度（py）分组加层数后缀；
  // 字号加大 1.5 倍（上限 16px），全局矩形迭代避让保证无重叠（与 A 方案一致）
  const marks = CARGOS.map((c, i) => ({
    i, py: c.py,
    cx: vx + (c.px + c.sx / 2) * vSX,
    cy: vy + (c.pz + c.sz / 2) * vSY,
    rw: c.sx * vSX, rh: c.sz * vSY,
  }));
  const used = new Set(), groups = [];
  for (let i = 0; i < marks.length; i++) {
    if (used.has(i)) continue;
    const g = [i];
    let changed = true;
    while (changed) {
      changed = false;
      for (let j = i + 1; j < marks.length; j++) {
        if (used.has(j) || g.includes(j)) continue;
        if (g.some(m => Math.abs(marks[m].cx - marks[j].cx) < 22 && Math.abs(marks[m].cy - marks[j].cy) < 18)) {
          g.push(j); changed = true;
        }
      }
    }
    g.forEach(m => used.add(m));
    groups.push(g);
  }
  const notes = [];
  for (const g of groups) {
    g.sort((a, b) => marks[a].py - marks[b].py);   // 下层在前
    const n = g.length;
    g.forEach((m, k) => {
      const txt = circNum(dispPos[marks[m].i] + 1) + (n > 1 ? '-' + (k + 1) : '');
      const fs = Math.max(10, Math.min(marks[m].rw * 0.7, marks[m].rh * 1.0, 16));
      ctx.font = `bold ${fs}px sans-serif`;
      const tw = ctx.measureText(txt).width;
      notes.push({
        txt, fs,
        w: tw + 2, h: fs + 4,
        x: marks[m].cx - tw / 2, y: marks[m].cy - (fs + 4) / 2,
        ax: marks[m].cx, ay: marks[m].cy,   // 锚点 = 货物矩形中心
      });
    });
  }
  const rectOverlap = (A, B) =>
    Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x) > 0 &&
    Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y) > 0;
  for (let iter = 0; iter < 50; iter++) {
    let moved = false;
    for (let a = 0; a < notes.length; a++) for (let b = a + 1; b < notes.length; b++) {
      const A = notes[a], B = notes[b];
      const ox = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x);
      const oy = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y);
      if (ox > 0 && oy > 0) {
        moved = true;
        const wA = (B.w * B.h) / (A.w * A.h + B.w * B.h);   // 小的多让位
        if (ox < oy) {
          const dir = A.x < B.x ? -1 : 1;
          A.x += dir * ox * wA; B.x += -dir * ox * (1 - wA);
        } else {
          const dir = A.y < B.y ? -1 : 1;
          A.y += dir * oy * wA; B.y += -dir * oy * (1 - wA);
        }
      }
    }
    for (const N of notes) {
      let collides = false;
      for (const O of notes) {
        if (O !== N && rectOverlap(N, O)) { collides = true; break; }
      }
      if (!collides) {   // 不重叠才回拉锚点
        N.x += (N.ax - N.w / 2 - N.x) * 0.2;
        N.y += (N.ay - N.h / 2 - N.y) * 0.2;
      }
      N.x = Math.max(vx, Math.min(vx + vw - N.w, N.x));
      N.y = Math.max(vy, Math.min(vy + vh - N.h, N.y));
    }
    if (!moved) break;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const N of notes) {
    ctx.fillStyle = '#1a1a1a';
    ctx.font = `bold ${N.fs}px sans-serif`;
    ctx.fillText(N.txt, N.x + N.w / 2, N.y + N.h / 2);
  }

  // ── 门方向指示（最后绘制，置顶不被柜体/货物遮挡）──
  // 门在 x=l 端（x=max, y=0, z=w/2）。标签中心取用户坐标 (l+520, 0, w/2)（即 12500+50,0,1175 的通用形式），
  // 旋转角度动态取柜体长边（x 方向）在屏幕上的实际角度，与货柜摆放角度严格一致；
  // 沿门外方向自适应外推，直到整个旋转标签的 4 角都在柜体轮廓外（真正"柜门外"）
  const [doorP0x, doorP0y] = proj(0, 0, 0);
  const [doorP1x, doorP1y] = proj(l, 0, 0);
  const doorAng = Math.atan2(doorP1y - doorP0y, doorP1x - doorP0x);   // 柜体长边（x 方向）屏幕角度
  ctx.font = 'bold 13px "Segoe UI","PingFang SC",sans-serif';
  const doorTxt1 = '货柜门方向';
  const doorTxt2 = '▶';   // 向右实心三角，比 → 醒目
  const doorW1 = ctx.measureText(doorTxt1).width;
  ctx.font = 'bold 17px sans-serif';
  const doorW2 = ctx.measureText(doorTxt2).width;
  const doorW = doorW1 + doorW2 + 3;
  const dBw2 = doorW + 28, dBh2 = 34, hw2 = dBw2 / 2, hh2 = dBh2 / 2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(...proj(...corners[0]));
  for (let k = 1; k < corners.length; k++) ctx.lineTo(...proj(...corners[k]));
  ctx.closePath();
  const inHull = (x, y) => ctx.isPointInPath(x, y);
  const [bmx, bmy] = proj(l + 520, 0, w / 2);   // 门底边中点外 520mm（x 在原坐标基础上再 +50）
  const cosA = Math.cos(doorAng), sinA = Math.sin(doorAng);
  let dOff2 = 0, dtx2 = bmx, dty2 = bmy;
  const cornersOut = () => {
    for (const [lx, ly] of [[-hw2, -hh2], [hw2, -hh2], [hw2, hh2], [-hw2, hh2]]) {
      if (inHull(dtx2 + lx * cosA - ly * sinA, dty2 + lx * sinA + ly * cosA)) return false;
    }
    return true;
  };
  while (dOff2 < 260 && !cornersOut()) {
    dOff2 += 10;
    dtx2 = bmx + Math.cos(doorAng) * dOff2;
    dty2 = bmy + Math.sin(doorAng) * dOff2;
  }
  ctx.restore();
  ctx.save();
  ctx.translate(dtx2, dty2);
  ctx.rotate(doorAng);   // 与货柜摆放角度一致
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(43,108,176,0.13)';
  ctx.beginPath(); ctx.roundRect(-dBw2 / 2, -dBh2 / 2, dBw2, dBh2, 16); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = '#2b6cb0'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.roundRect(-dBw2 / 2, -dBh2 / 2, dBw2, dBh2, 16); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2b6cb0';
  ctx.font = 'bold 13px "Segoe UI","PingFang SC",sans-serif';
  ctx.fillText(doorTxt1, -dBw2 / 2 + 14, 1);
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(doorTxt2, -dBw2 / 2 + 14 + doorW1 + 3, 1);
  ctx.restore();
}

// 悬停联动：徽标 <-> 清单行
cv.addEventListener('mousemove', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  let hit = -1;
  for (let i = 0; i < CARGOS.length; i++) {
    const bx = badges[i].x, by = badges[i].y;
    if ((mx - bx) ** 2 + (my - by) ** 2 <= 24 ** 2) { hit = i; break; }
  }
  if (hit === -1) {
    const row = Math.floor((my - headY - 12) / rowH);
    if (row >= 0 && row < CARGOS.length && mx >= LIST_X - 10 && mx <= LIST_X + 600) hit = SORT_INDEX[row];   // 行号 → 原索引
  }
  if (hit !== hoverIdx) { hoverIdx = hit; draw(); }
});
cv.addEventListener('mouseleave', () => { if (hoverIdx !== -1) { hoverIdx = -1; draw(); } });

function dl() {
  hoverIdx = -1; draw();
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = `装柜图B_${CONTAINER.name}_${new Date().toISOString().slice(0, 10)}.png`;
  a.click();
}
function goBack() { if (window.history.length > 1) window.history.back(); }

draw();
</script>
</body>
