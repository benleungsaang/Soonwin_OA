function importObjectForm(){openModal('\u5bfc\u5165\u969c\u788d\u7269',`<div class=\"notice\">\u7c98\u8d34\u5236\u8868\u7b26\u5206\u9694\u6570\u636e\uff1a\u540d\u79f0\u3001\u5c3a\u5bf8\u3001\u4f4d\u7f6e\u3002\u5c3a\u5bf8\u5982 500x500\uff0c\u4f4d\u7f6e\u5982 A2\u3002</div><textarea id=\"objectImportText\" rows=\"8\" style=\"width:100%\"></textarea>`,()=>{const rows=$('objectImportText').value.trim().split(/\r?\n/).map(line=>line.split('\t'));if(!rows.length||!rows[0][0])return alert('\u6ca1\u6709\u6709\u6548\u6570\u636e'),false;const parsed=rows.map(r=>({r,d:(r[1]||'').split(/[x*]/).map(Number),p:(r[2]||'').match(/^([A-Z])(\d+)$/i)})).filter(x=>x.r[0]&&x.d[0]&&x.d[1]);if(!parsed.length)return alert('\u6ca1\u6709\u5c3a\u5bf8\u6709\u6548\u7684\u969c\u788d\u7269'),false;pushUndo();parsed.forEach(({r,d,p},i)=>floor.objects.push({id:`objimp-${Date.now()}-${i}`,name:r[0],type:'OTHER',x:p?Math.max(0,(p[1].toUpperCase().charCodeAt(0)-65)*floor.width/floor.cols):0,y:p?Math.max(0,(+p[2]-1)*floor.length/floor.rows):0,w:d[0],h:d[1],h3:1100,color:'#687586',blocks:true}));markDirty();floorMesh();return true})}

function batchColumnForm(){openModal('批量添加柱',`<div class="columns">${field('柱长度 mm','bcW',500)}${field('柱宽度 mm','bcD',500)}</div><p class="notice">在每个尚无柱子的网格交叉点居中添加柱；已有柱位会跳过。</p>`,()=>{const w=+$('bcW').value,d=+$('bcD').value;if(!w||!d)return alert('请输入有效尺寸'),false;const pts=[];for(let c=0;c<=floor.cols;c++)for(let r=0;r<=floor.rows;r++){const x=c*floor.width/floor.cols-w/2,y=r*floor.length/floor.rows-d/2;if(x<0||y<0||x+w>floor.width||y+d>floor.length)continue;if(floor.objects.some(o=>o.type==='COLUMN'&&Math.abs(o.x+w/2-c*floor.width/floor.cols)<w/2&&Math.abs(o.y+d/2-r*floor.length/floor.rows)<d/2))continue;pts.push({x,y})}if(!pts.length)return alert('所有网格交叉点都已有柱'),false;pushUndo();pts.forEach((p,i)=>floor.objects.push({id:`col-${Date.now()}-${i}`,name:`柱 ${floor.objects.length+1}`,type:'COLUMN',x:p.x,y:p.y,w,h:d,h3:2600,color:'#687586',blocks:true}));markDirty();floorMesh();return true})}
function floorForm(f=floor,isNew=false){openModal(isNew?'新建楼层':'楼层设置',`<div class="field"><label>楼层名称</label><input id="flName" value="${esc(f.name)}"></div><div class="columns">${field('宽度 mm','flW',f.width)}${field('长度 mm','flL',f.length)}${field('列数','flC',f.cols)}${field('行数','flR',f.rows)}</div>`,()=>{if(isNew){const n={id:`floor-${Date.now()}`,name:$('flName').value||'新楼层',width:+$('flW').value,length:+$('flL').value,cols:+$('flC').value,rows:+$('flR').value,cargos:[],objects:[]};data.floors.push(n);floor=n}else Object.assign(f,{name:$('flName').value,width:+$('flW').value,length:+$('flL').value,cols:+$('flC').value,rows:+$('flR').value});if(!floor.width||!floor.length||!floor.cols||!floor.rows)return alert('楼层尺寸和网格必须大于 0'),false;markDirty();floorMesh();return true})}
function contextMenu(x,y,meta){const el=$('context'),c=meta.kind==='cargo'?findData(meta.id,'cargo'):null,o=meta.kind==='object'?findData(meta.id,'object'):null;let acts='';if(c&&c.owner==='OWN'&&$('lockOwn').checked)acts='<button disabled>货物已锁定</button>';else if(c&&c.owner==='OWN')acts=`<button data-act="edit">修改信息</button><button data-act="rotate">旋转 90°</button><button data-act="copy">复制</button><button data-act="ship">出货</button><button data-act="delete">删除</button>`;else if(c)acts='<button disabled>其它部门货物：只读</button>';else if(o&&$('lockObjects').checked)acts='<button disabled>障碍物已锁定</button>';else if(o)acts='<button data-act="editobj">编辑障碍物</button><button data-act="delete">删除障碍物</button>';el.innerHTML=acts||'<button disabled>无可用操作</button>';el.style.left=`${Math.min(x,innerWidth-190)}px`;el.style.top=`${Math.min(y,innerHeight-180)}px`;el.style.display='block';el.onclick=e=>{const a=e.target.dataset.act;el.style.display='none';if(a==='edit')cargoForm(c);if(a==='editobj'&&!$('lockObjects').checked)objectForm(o);if(a==='rotate')rotateSelection();if(a==='copy'){copySelection();pasteSelection()}if(a==='ship')shipSelection();if(a==='delete')deleteSelection()}}
window.addEventListener('click',e=>{if(!e.target.closest('#context'))$('context').style.display='none'});
function bindList(id,kind){$(id).addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),editObj=e.target.closest('[data-editobj]'),more=e.target.closest('[data-more]'),moreObj=e.target.closest('[data-moreobj]');if(edit){const c=findData(edit.dataset.edit,'cargo');if(c.owner==='OTHER'||$('lockOwn').checked)return;return cargoForm(c)}if(editObj){if($('lockObjects').checked)return;return objectForm(findData(editObj.dataset.editobj,'object'))}if(more||moreObj){const elem=more||moreObj,meta={id:elem.dataset.more||elem.dataset.moreobj,kind:more?'cargo':'object'};return contextMenu(e.clientX,e.clientY,meta)}const row=e.target.closest('.item');if(!row)return;const m={id:row.dataset.id,kind};if(kind==='cargo'&&!hitAllowed(m))return;if(e.ctrlKey||e.metaKey)selected.has(m.id)?selected.delete(m.id):selected.add(m.id);else{selected.clear();selected.add(m.id)}syncSelection()})}
bindList('cargoList','cargo');bindList('otherList','cargo');bindList('objectList','object');
document.addEventListener('click',e=>{const m=e.target.closest('[data-menu]');if(m){document.querySelectorAll('.menu-pop').forEach(x=>x.classList.toggle('open',x.id===m.dataset.menu&&!x.classList.contains('open')));$('floorMenu').classList.remove('open');return}if(e.target.closest('#floorSettings'))return;if(!e.target.closest('.menu-wrap'))document.querySelectorAll('.menu-pop,.floor-menu').forEach(x=>x.classList.remove('open'));const collapse=e.target.closest('[data-collapse]');if(collapse&&!e.target.closest('.head-tools'))$(collapse.dataset.collapse).classList.toggle('collapsed')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-menu-action]');if(!b)return;const act=b.dataset.menuAction;document.querySelectorAll('.menu-pop').forEach(x=>x.classList.remove('open'));if(act==='add-own')cargoForm(null,'OWN');if(act==='add-other')cargoForm(null,'OTHER');if(act==='import-own')importForm('OWN');if(act==='import-other')importForm('OTHER');if(act==='copy-own')copyCargoList('OWN');if(act==='copy-other')copyCargoList('OTHER');if(act==='add-object')objectForm();if(act==='import-object')importObjectForm();if(act==='copy-object')copyObjectList()});
for(const id of ['showOwn','showOther','showObjects','lockOwn','lockOther','lockObjects'])$(id).onchange=()=>{for(const sid of [...selected]){const c=findData(sid,'cargo'),o=findData(sid,'object');if((c&&(!cargoVisible(c)||(c.owner==='OTHER'&&$('lockOther').checked)||(c.owner!=='OTHER'&&$('lockOwn').checked)))||(o&&$('lockObjects').checked))selected.delete(sid)}updateUI()};for(const id of ['allowOverlap','allowOutside','passObjects'])$(id).onchange=()=>{collisionDirty=true;updateUI()};$('search').oninput=updateUI;
$('addCargo').onclick=()=>cargoForm();$('importCargo').onclick=()=>importForm('OWN');$('addObject').onclick=$('addObject2').onclick=()=>objectForm();$('batchColumns').onclick=batchColumnForm;$('floorSettings').onclick=e=>{$('floorMenu').classList.toggle('open')};$('editFloor').onclick=()=>{$('floorMenu').classList.remove('open');floorForm()};$('deleteFloor').onclick=()=>{$('floorMenu').classList.remove('open');deleteFloor()};$('newFloor').onclick=()=>floorForm({name:'新楼层',width:20000,length:10000,cols:8,rows:4,cargos:[],objects:[]},true);$('floorSelect').onchange=()=>{floor=data.floors.find(f=>f.id===$('floorSelect').value)||data.floors[0];selected.clear();world.remove(floorGroup);floorGroup=new THREE.Group();world.add(floorGroup);controls.target.set(floor.width/2,0,floor.length/2);floorMesh();fitView()};$('save').onclick=saveLocal;$('undo').onclick=undo;$('redo').onclick=redo;$('delete').onclick=deleteSelection;$('rotate').onclick=rotateSelection;$('copy').onclick=()=>{copySelection();pasteSelection()};$('ship').onclick=shipSelection;$('shipRecords').onclick=showShipments;
$('resetView').onclick=()=>{lockedView=false;$('lockView').textContent='🔒 锁定俯视';fitView()};$('lockView').onclick=()=>{lockedView=!lockedView;if(lockedView){camera.up.set(0,0,-1);camera.position.set(floor.width/2,Math.max(floor.width,floor.length)*1.35,floor.length/2+.01);controls.target.set(floor.width/2,0,floor.length/2);controls.minPolarAngle=controls.maxPolarAngle=0.001;controls.enableRotate=false;controls.enablePan=true;$('lockView').textContent='🔓 解锁视角'}else{camera.up.set(0,1,0);controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI*.49;controls.enableRotate=true;$('lockView').textContent='🔒 锁定俯视'}controls.update();requestRender()};
function fitView(){camera.up.set(0,1,0);controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI*.49;controls.enableRotate=true;const s=Math.max(floor.width,floor.length);camera.position.set(floor.width/2+s*1.05,s*1.05,floor.length/2+s*1.25);controls.target.set(floor.width/2,0,floor.length/2);camera.lookAt(controls.target);controls.update();requestRender()}
renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();const hit=hitTest(e),meta=hit&&objectByMesh.get(hit);if(meta){if(!selected.has(meta.id)){selected.clear();selected.add(meta.id);syncSelection()}contextMenu(e.clientX,e.clientY,meta)}else if(selected.size){selected.clear();syncSelection()}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c')copySelection();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v')pasteSelection();else if(e.key.toLowerCase()==='r')rotateSelection();else if(e.key==='Delete'||e.key==='Backspace')deleteSelection();else if(e.key==='Escape'){selected.clear();syncSelection()}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function setFloorVisibility(){floor.cargos.forEach(c=>{const m=meshById.get(c.id);if(m)m.visible=cargoVisible(c)});floor.objects.forEach(o=>{const m=meshById.get(o.id);if(m)m.visible=$('showObjects').checked});requestRender()}
function fitAspect(){resize()}
function updateCoordinatesOnMove(){updateCoordinates()}
function boot(){resize();floorMesh();fitView();updateUI();saveLocal()}
boot();
