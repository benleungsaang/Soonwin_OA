        function getToken() {
            return localStorage.getItem('oa_token');
        }

        async function apiGet(path) {
            const token = getToken();
            if (!token) throw new Error('未检测到登录凭证，请先在 OA 系统登录');
            const resp = await fetch(path, {
                headers: { 'Authorization': `Bearer ${token}` },
            });
            const json = await resp.json();
            if (!resp.ok || json.success === false) {
                throw new Error(json.message || `HTTP ${resp.status}`);
            }
            // 统一行为：解包后端 data 字段，与前端 request.ts 一致
            return json.data;
        }

        async function apiSend(method, path, body) {
            const token = getToken();
            if (!token) throw new Error('未检测到登录凭证，请先在 OA 系统登录');
            const resp = await fetch(path, {
                method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                body: body !== undefined ? JSON.stringify(body) : undefined,
            });
            const json = await resp.json();
            if (!resp.ok || json.success === false) {
                throw new Error(json.message || `HTTP ${resp.status}`);
            }
            return json.data;
        }

        // 保存到云端（覆盖当前方案）
        async function saveToCloud() {
            if (!currentLayoutMeta) {
                alert('当前未加载方案，请先在 OA 系统列表页打开/创建方案');
                return;
            }
            if (!currentLayoutMeta.is_owner) {
                // 非作者：弹窗询问是否另存为。确认→调用 saveAsNew；取消→无操作
                const ok = confirm('仅原作者可直接保存原方案\n当前是否需要另存为？');
                if (ok) {
                    await saveAsNew();
                }
                return;
            }
            try {
                saveBtn.disabled = true;
                const origText = saveBtn.textContent;
                saveBtn.textContent = '⏳ 保存中...';
                const data = buildLayoutData();
                // apiSend 已解包 → 返回 ContainerLayoutDetail
                currentLayoutMeta = await apiSend('PUT', `/api/container-layouts/${currentLayoutMeta.id}`, { data });
                saveBtn.textContent = '✅ 已保存';
                setTimeout(() => {
                    saveBtn.textContent = origText;
                    saveBtn.disabled = false;
                }, 1500);
            } catch (e) {
                console.error('saveToCloud failed:', e);
                alert('保存失败：' + e.message);
                saveBtn.textContent = '保存';
                saveBtn.disabled = false;
            }
        }

        // 另存为新方案
        async function saveAsNew() {
            const data = buildLayoutData();
            let defaultName = '';
            if (currentLayoutMeta) {
                defaultName = currentLayoutMeta.name + ' (副本)';
            } else {
                defaultName = '新建方案_' + new Date().toISOString().slice(0, 10);
            }
            const newName = prompt('请输入新方案名：', defaultName);
            if (newName === null) return;  // 取消
            const trimmed = newName.trim();
            if (!trimmed) {
                alert('方案名不能为空');
                return;
            }
            try {
                // apiSend 已解包 → 返回 ContainerLayoutDetail
                currentLayoutMeta = await apiSend('POST', '/api/container-layouts', { name: trimmed, data });
                // 复制创建后归属当前用户，保存按钮保持可用
                saveBtn.disabled = false;
                alert('已创建方案「' + trimmed + '」，请在 OA 列表页刷新查看。');
                // 更新 URL 使后续刷新仍能定位到该方案
                const u = new URL(window.location.href);
                u.searchParams.set('id', currentLayoutMeta.id);
                window.history.replaceState({}, '', u.toString());
            } catch (e) {
                console.error('saveAsNew failed:', e);
                alert('另存为失败：' + e.message);
            }
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const layoutId = urlParams.get('id');

            if (layoutId) {
                // 通过云端 API 加载指定方案
                try {
                    document.body.style.cursor = 'wait';
                    // apiGet 已解包后端 data 字段 → 返回 ContainerLayoutDetail
                    const meta = await apiGet(`/api/container-layouts/${layoutId}`);
                    const data = meta.data;
                    if (!data) throw new Error('方案数据为空');

                    // 填充 state
                    applyLoadedLayout(data);

                    // 同步 UI
                    syncUIFromState();
                    buildScene();

                    // 同步 textarea
                    cargoInput.value = data.cargos.map(c =>
                        `${c.name}, ${c.sx}*${c.sz}*${c.sy}`
                    ).join('\n');

                    rebuildCargoMeshes();
                    updateStats();

                    // 跟踪当前方案元数据
                    currentLayoutMeta = meta;
                    // 保存按钮始终可用：非作者点击后会弹 confirm 询问是否另存为
                    saveBtn.disabled = false;
                    // 更新页面标题
                    document.title = `货柜排布 - ${meta.name}`;

                    console.log('[editor] 已加载方案', meta);
                } catch (e) {
                    console.error('[editor] 加载方案失败:', e);
                    alert('加载方案失败：' + e.message + '\n\n将使用默认演示数据。');
                    loadDefault();
                } finally {
                    document.body.style.cursor = '';
                }
            } else {
                // 无 id：使用默认演示数据
                loadDefault();
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);

            // 更新轴指示器：与主相机同方向
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            axesCam.position.copy(dir).multiplyScalar(-axesDist);
            axesCam.lookAt(0, 0, 0);
            axesRenderer.render(axesScene, axesCam);
        }

        init();

        // ============================================================
        //  Delete键删除选中货物 / R 键水平旋转选中货物
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (editModal.classList.contains('active')) return;

            // Escape：取消选中
            if (e.key === 'Escape') {
                if (state.selectedCargo !== null && state.selectedCargo !== undefined) {
                    deselectCargo();
                    e.preventDefault();
                }
                return;
            }

            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (state.selectedCargo !== null && state.selectedCargo !== undefined) {
                    const idx = state.selectedCargo;
                    if (idx >= 0 && idx < state.cargos.length) {
                        if (confirm(`确定删除 "${state.cargos[idx].name}" 吗？`)) {
                            state.cargos.splice(idx, 1);
                            state.selectedCargo = null;
                            controls.enabled = true;
                            rebuildCargoMeshes();
                            updateStats();
                            saveState();
                            e.preventDefault();
                        }
                    }
                }
                return;
            }

            // Ctrl+S：保存到云端
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveToCloud();
                return;
            }

            // R 键：水平旋转 90°
            if (e.key === 'r' || e.key === 'R') {
                if (state.selectedCargo !== null && state.selectedCargo !== undefined) {
                    const idx = state.selectedCargo;
                    if (idx >= 0 && idx < state.cargos.length) {
                        rotateCargo(idx);
                        e.preventDefault();
                    }
                }
            }
        });

        console.log('📦 货柜装货可视化工具已加载');
        console.log('💡 右上角 ⛏即点即拖 / 👆点击选中 切换操作模式');
        console.log('💡 Delete删除 · R旋转 · Ctrl+S保存 · 列表/颜色点可编辑');
    </script>
</body>

</html>
