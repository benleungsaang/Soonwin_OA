<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>装柜图 - A（文字直标）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 20px 30px 50px; }
  h1 { font-size: 19px; color: #ffd93d; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8899aa; margin-bottom: 16px; line-height: 1.8; }
  .card { background: #16213e; border: 1px solid #2a2a5e; border-radius: 12px; padding: 16px 20px; }
  canvas { display: block; background: #fff; border-radius: 6px; max-width: 100%; height: auto; cursor: crosshair; }
  .legend { font-size: 12px; color: #ccc; margin: 10px 0 0; display: flex; gap: 20px; flex-wrap: wrap; }
  .legend b { font-weight: 600; }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  .btn { background: #0f3460; color: #ccc; border: none; padding: 6px 18px; border-radius: 16px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #1a4a7a; color: #fff; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #ff6b81; }
</style>
</head>
<body>
<h1>📦 装柜图 - A（等轴测 · 文字直标自动避让）</h1>
<div class="sub" id="subInfo">加载数据中…</div>

<div class="card">
  <canvas id="cv" width="1500" height="1000"></canvas>
  <div class="legend">
    <span><b style="color:#c62828">▲名称</b> = 堆叠货物</span>
    <span><b style="color:#b26a00">⚠名称</b> = 悬空货物</span>
    <span><b style="color:#999">地面菱形</b> = 底部投影 · <b style="color:#2b6cb0">虚线网格</b> = 每500/1000mm</span>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="dl()">⬇ 下载图片</button>
    <button class="btn" onclick="goBack()">← 返回编辑器</button>
  </div>
</div>

<script>
// ============================================================
//  数据加载：优先取编辑器存下的当前布局，否则内置演示数据（id=3）
// ============================================================
const DEMO_CONTAINER = { name: '40尺高柜', l: 12030, w: 2350, h: 2690 };
const DEMO_CARGOS = [
  { name: 'ESS250B主机222', sx: 1390, sy: 1550, sz: 840,  px: 7370, py: 0,   pz: 0,    color: '#e94560' },
  { name: 'ESS250B尾架',    sx: 2500, sy: 300,  sz: 640,  px: 7110, py: 630, pz: 1050, color: '#ff6b6b' },
  { name: 'ESS450B主机',    sx: 1590, sy: 1570, sz: 1040, px: 5520, py: 0,   pz: 1310, color: '#ffa94d' },
  { name: 'ESS450B尾架',    sx: 2500, sy: 300,  sz: 640,  px: 7110, py: 330, pz: 1050, color: '#ffd93d' },
  { name: 'SZ750W主机',     sx: 2170, sy: 1570, sz: 1350, px: 0,    py: 0,   pz: 950,  color: '#6bcb77' },
  { name: 'SZ750W尾架',     sx: 3430, sy: 330,  sz: 1100, px: 8600, py: 0,   pz: 1250, color: '#4d96ff' },
  { name: '东鹏制氮机',     sx: 1500, sy: 2250, sz: 1310, px: 4220, py: 0,   pz: 0,    color: '#845ef7' },
  { name: '东鹏空压机',     sx: 1000, sy: 1250, sz: 1300, px: 5720, py: 0,   pz: 0,    color: '#cc5de8' },
  { name: '升奥注芯机',     sx: 2580, sy: 1510, sz: 950,  px: 0,    py: 0,   pz: 0,    color: '#20c997' },
  { name: '顺意达包馅机',   sx: 1300, sy: 1750, sz: 1000, px: 4220, py: 0,   pz: 1310, color: '#ff922b' },
  { name: '顺意达打饼机',   sx: 650,  sy: 1480, sz: 1050, px: 6720, py: 0,   pz: 0,    color: '#339af0' },
  { name: '顺意达立式排盘机', sx: 1640, sy: 1950, sz: 1730, px: 2580, py: 0, pz: 0,  color: '#f06595' },
];

let CONTAINER, CARGOS, planName;
try {
  const raw = localStorage.getItem('container_layout_preview_a');
  if (raw) {
    const saved = JSON.parse(raw);
    const d = saved.data;
    if (d && d.container && Array.isArray(d.cargos)) {
      CONTAINER = { name: d.container.name || '货柜', l: d.container.l, w: d.container.w, h: d.container.h };
      CARGOS = d.cargos.map(c => ({
        name: c.name, sx: c.sx, sy: c.sy, sz: c.sz,
        px: c.px, py: c.py, pz: c.pz, color: c.color || '#e94560',
      }));
      planName = saved.name || '';
    }
  }
} catch (e) { console.warn('[preview-a] 读取布局数据失败，使用演示数据:', e); }
if (!CONTAINER) { CONTAINER = DEMO_CONTAINER; CARGOS = DEMO_CARGOS; planName = '（演示数据 id=3）'; }
document.getElementById('subInfo').innerHTML =
  `方案：<b>${planName}</b> · 货柜：${CONTAINER.name} ${CONTAINER.l}×${CONTAINER.w}×${CONTAINER.h}mm · ${CARGOS.length} 件货`;

// ============================================================
//  堆叠 / 悬空检测
// ============================================================
function detectStacking(cargos) {
  return cargos.map((a, i) => {
    const st = { stacked: false, suspended: false, on: [] };
    if (a.py > 1) {
      for (let j = 0; j < cargos.length; j++) {
        if (i === j) continue;
        const b = cargos[j];
        if (Math.abs(a.py - (b.py + b.sy)) > 1) continue;
        const ox = Math.max(0, Math.min(a.px + a.sx, b.px + b.sx) - Math.max(a.px, b.px));
        const oz = Math.max(0, Math.min(a.pz + a.sz, b.pz + b.sz) - Math.max(a.pz, b.pz));
        if (ox > 1 && oz > 1) { st.stacked = true; st.on.push(j); }
      }
      if (!st.stacked) st.suspended = true;
    }
    return st;
  });
}
const STACK = detectStacking(CARGOS);
const hexRgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

// ============================================================
//  投影：自动适配整柜完整显示
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const cos30 = 0.8660, sin30 = 0.5;
const { l, w, h } = CONTAINER;
const corners = [[0,0,0],[l,0,0],[l,0,w],[0,0,w],[0,h,0],[l,h,0],[l,h,w],[0,h,w]];
const raw = corners.map(([x, y, z]) => [(x - z) * cos30, (x + z) * sin30 - y]);
const xs = raw.map(p => p[0]), ys = raw.map(p => p[1]);
const S = Math.min((W - 110) / (Math.max(...xs) - Math.min(...xs)),
                   (H - 110) / (Math.max(...ys) - Math.min(...ys)));
const ox = W / 2 - (Math.min(...xs) + Math.max(...xs)) / 2 * S;
const oy = (H - 90) / 2 + 45 - (Math.min(...ys) + Math.max(...ys)) / 2 * S;
const proj = (x, y, z) => [ox + (x - z) * cos30 * S, oy + (x + z) * sin30 * S - y * S];
const topPts = CARGOS.map(c => {
  const p0 = proj(c.px, c.py + c.sy, c.pz), p1 = proj(c.px + c.sx, c.py + c.sy, c.pz),
        p2 = proj(c.px + c.sx, c.py + c.sy, c.pz + c.sz), p3 = proj(c.px, c.py + c.sy, c.pz + c.sz);
  return { poly: [p0, p1, p2, p3], center: proj(c.px + c.sx / 2, c.py + c.sy, c.pz + c.sz / 2) };
});

// ============================================================
//  标签：直标 + 迭代避让
// ============================================================
function labelInfo(i) {
  const c = CARGOS[i]; const st = STACK[i];
  const nameTxt = (st.stacked ? '▲' : st.suspended ? '⚠' : '') + c.name;
  const dimTxt = c.sx + '×' + c.sz + '×' + c.sy;
  const stateTxt = st.stacked ? '叠放于' + st.on.map(j => CARGOS[j].name).join('、') + '上' : (st.suspended ? '悬空' + c.py + 'mm需支撑' : '');
  const w = Math.max(66, Math.min(168, nameTxt.length * 14.5 + 16));
  const h = 20 + 17 + (stateTxt ? 15 : 0);
  return { nameTxt, dimTxt, stateTxt, w, h };
}
const labels = CARGOS.map((c, i) => {
  const info = labelInfo(i);
  const [cx, cy] = topPts[i].center;
  const x = cx - info.w / 2;
  const y = cy - info.h - 6;
  return { i, x, y, w: info.w, h: info.h, ax: x, ay: y };
});
for (let iter = 0; iter < 60; iter++) {
  let moved = false;
  for (let a = 0; a < labels.length; a++) for (let b = a + 1; b < labels.length; b++) {
    const A = labels[a], B = labels[b];
    const ox = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x);
    const oy = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y);
    if (ox > 0 && oy > 0) {
      moved = true;
      const areaA = A.w * A.h, areaB = B.w * B.h;
      const wA = areaB / (areaA + areaB), wB = areaA / (areaA + areaB);
      if (ox < oy) {
        const dir = A.x < B.x ? -1 : 1;
        A.x += dir * ox * wA; B.x += -dir * ox * wB;
      } else {
        const dir = A.y < B.y ? -1 : 1;
        A.y += dir * oy * wA; B.y += -dir * oy * wB;
      }
    }
  }
  for (const L of labels) {
    L.x += (L.ax - L.x) * 0.22;
    L.y += (L.ay - L.y) * 0.22;
    L.x = Math.max(4, Math.min(W - L.w - 4, L.x));
    L.y = Math.max(30, Math.min(H - L.h - 30, L.y));
  }
  if (!moved) break;
}

// ============================================================
//  绘制
// ============================================================
let hoverIdx = -1;
const quad = (pts, fill, stroke, lw, dash) => {
  ctx.save();
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1;
  ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
};

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1a3a5c'; ctx.font = 'bold 18px "Segoe UI","PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`货柜装柜图（等轴测·直标）— ${planName}（${CONTAINER.name} ${l}×${w}×${h}mm）`, 26, 34);
  ctx.fillStyle = '#888'; ctx.font = '12px sans-serif';
  ctx.fillText('门端 →', W - 100, 34);

  // 地面网格
  const gxStep = l > 8000 ? 1000 : 500, gzStep = w > 2000 ? 500 : 250;
  ctx.save(); ctx.strokeStyle = 'rgba(120,140,170,0.3)'; ctx.lineWidth = 0.6;
  for (let gx = 0; gx <= l; gx += gxStep) { ctx.beginPath(); ctx.moveTo(...proj(gx, 0, 0)); ctx.lineTo(...proj(gx, 0, w)); ctx.stroke(); }
  for (let gz = 0; gz <= w; gz += gzStep) { ctx.beginPath(); ctx.moveTo(...proj(0, 0, gz)); ctx.lineTo(...proj(l, 0, gz)); ctx.stroke(); }
  ctx.restore();

  // 柜体
  quad([proj(0,0,0), proj(l,0,0), proj(l,0,w), proj(0,0,w)], 'rgba(43,108,176,0.07)', 'rgba(43,108,176,0.9)', 2.5);
  ctx.save(); ctx.strokeStyle = 'rgba(43,108,176,0.45)'; ctx.lineWidth = 1.1; ctx.setLineDash([6, 5]);
  for (const [a, b] of [[0,4],[1,5],[2,6],[3,7],[4,5],[5,6],[6,7],[7,4]]) {
    ctx.beginPath(); ctx.moveTo(...proj(...corners[a])); ctx.lineTo(...proj(...corners[b])); ctx.stroke();
  }
  ctx.restore();

  // 底部投影 + 悬空垂落线
  CARGOS.forEach((c, i) => {
    quad([proj(c.px,0,c.pz), proj(c.px+c.sx,0,c.pz), proj(c.px+c.sx,0,c.pz+c.sz), proj(c.px,0,c.pz+c.sz)], 'rgba(0,0,0,0.10)', 'rgba(0,0,0,0.22)', 0.8);
    if (STACK[i].suspended) {
      ctx.save(); ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(...proj(c.px+c.sx/2, 0, c.pz+c.sz/2)); ctx.lineTo(...proj(c.px+c.sx/2, c.py, c.pz+c.sz/2)); ctx.stroke();
      ctx.restore();
    }
  });

  // 货物
  const order = CARGOS.map((c, i) => i).sort((a, b) => (CARGOS[a].px + CARGOS[a].py + CARGOS[a].pz) - (CARGOS[b].px + CARGOS[b].py + CARGOS[b].pz));
  for (const i of order) {
    const c = CARGOS[i]; const st = STACK[i];
    const isHover = hoverIdx === i;
    const [x0, y0, z0] = [c.px, c.py, c.pz];
    const p = (dx, dy, dz) => proj(x0 + dx, y0 + dy, z0 + dz);
    const alpha = isHover ? 1 : 0.66;
    const edgeW = st.stacked ? 2.5 : 1.1;
    quad([p(c.sx,0,0), p(c.sx,0,c.sz), p(c.sx,c.sy,c.sz), p(c.sx,c.sy,0)], hexRgba(c.color, 0.5 * alpha), 'rgba(0,0,0,0.45)', edgeW);
    quad([p(0,0,c.sz), p(c.sx,0,c.sz), p(c.sx,c.sy,c.sz), p(0,c.sy,c.sz)], hexRgba(c.color, 0.72 * alpha), 'rgba(0,0,0,0.45)', edgeW);
    quad([p(0,c.sy,0), p(c.sx,c.sy,0), p(c.sx,c.sy,c.sz), p(0,c.sy,c.sz)], hexRgba(c.color, 0.95 * alpha),
         st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : 'rgba(0,0,0,0.55)'), edgeW + 0.6, st.suspended ? [4,3] : null);
    if (isHover) {
      ctx.save(); ctx.strokeStyle = '#e94560'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(...topPts[i].poly[0]);
      for (let k = 1; k < 4; k++) ctx.lineTo(...topPts[i].poly[k]);
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }
  }

  // 标签
  for (const L of labels) {
    const c = CARGOS[L.i]; const st = STACK[L.i]; const info = labelInfo(L.i);
    const isHover = hoverIdx === L.i;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(L.x, L.y, L.w, L.h, 5);
    ctx.fillStyle = isHover ? 'rgba(233,69,96,0.12)' : 'rgba(255,255,255,0.88)';
    ctx.fill();
    ctx.strokeStyle = isHover ? '#e94560' : (st.stacked ? '#c62828' : (st.suspended ? '#b26a00' : '#8aa0b8'));
    ctx.lineWidth = isHover ? 2.5 : 1.2; ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 13px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillText(info.nameTxt, L.x + 8, L.y + 16);
    ctx.fillStyle = '#555'; ctx.font = '12px Consolas,monospace';
    ctx.fillText(info.dimTxt, L.x + 8, L.y + 32);
    if (info.stateTxt) {
      ctx.fillStyle = st.stacked ? '#c62828' : '#b26a00';
      ctx.font = '11px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillText(info.stateTxt, L.x + 8, L.y + 48);
    }
    ctx.restore();
  }

  // 图例
  ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('图例：', 26, H - 24);
  ctx.fillStyle = '#c62828'; ctx.fillText('▲ 堆叠', 84, H - 24);
  ctx.fillStyle = '#b26a00'; ctx.fillText('⚠ 悬空', 154, H - 24);
  ctx.fillStyle = '#333'; ctx.fillText('白底标签 = 名称+尺寸（自动避让）', 224, H - 24);
}

// 悬停
cv.addEventListener('mousemove', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  let hit = -1;
  for (let i = 0; i < CARGOS.length; i++) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(...topPts[i].poly[0]);
    for (let k = 1; k < 4; k++) ctx.lineTo(...topPts[i].poly[k]);
    ctx.closePath();
    if (ctx.isPointInPath(mx, my)) { hit = i; break; }
    ctx.restore();
  }
  if (hit !== hoverIdx) { hoverIdx = hit; draw(); }
});
cv.addEventListener('mouseleave', () => { if (hoverIdx !== -1) { hoverIdx = -1; draw(); } });

function dl() {
  hoverIdx = -1; draw();
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = `装柜图A_${CONTAINER.name}_${new Date().toISOString().slice(0, 10)}.png`;
  a.click();
}
function goBack() { if (window.history.length > 1) window.history.back(); }

draw();
</script>
</body>
</html>
