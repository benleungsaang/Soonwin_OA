# oa_frontend.conf 完整配置（由Python脚本自动生成）
worker_processes  1;  # 内网自用，1个进程足够
pid        "D:/Soonwin_OA/nginx-1.28.1/logs/nginx.pid";  # 修复：Nginx兼容的正斜杠路径，加引号

events {
    worker_connections  1024;
}

http {
    include       "D:/Soonwin_OA/nginx-1.28.1/conf/mime.types";
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_server {
        server 127.0.0.1:5000;
        keepalive 64;
    }

    server {
        listen       5183;
        # server_name  localhost 192.168.110.13;
        # 修改：server_name 改为 _（匹配所有IP/域名），适配192.168.30.xx网段
        server_name  _;
        root         D:/Soonwin_OA/SoonwinOA_Frontend;
        index        index.html;
        # 核心：允许200MB的请求体（必须≥你的最大上传文件大小）
        client_max_body_size 200M;

        # 请求体缓冲区大小（Windows下建议适度增大）
        # 默认16K太小，大文件会频繁写临时文件，调整为128K
        client_body_buffer_size 128K;

        # 指定请求体临时文件存储路径（Windows下需确保目录存在）
        # 避免系统临时目录权限问题，建议自定义
        client_body_temp_path "D:/Soonwin_OA/nginx-1.28.1/temp/personal_temp_files";

        # 代理缓冲区（针对/api/转发的请求，避免后端接收不完整）
        proxy_buffering on;
        proxy_buffer_size 64K;
        proxy_buffers 4 64K;

        # 当前这条写法每增加一个新的文件夹都要在这里填入并重启服务器，所以修改为后一条的通用写法
        # rewrite ^/assets/(Media|OrderStatus|TemplateImg|attendance|OrderRecords)/(.*)$ /backend-assets/$1/$2 last;
        rewrite ^/assets/([^/]+)/(.*)$ /backend-assets/$1/$2 last;

        # ~* 正则匹配优先级高于 ^~ 前缀匹配，确保脚本先被处理
        location ~* ^/assets/(.*)\.(css|js|mjs|png|jpg|jpeg|ico|svg|woff|woff2|ttf)$ {
            try_files $uri $uri/ =404;
            expires 1d;
            # 允许模块脚本跨域（模块加载的额外要求）
            add_header Access-Control-Allow-Origin *;
            # 针对脚本/样式文件补充MIME类型
            if ($request_uri ~* \.css$) {
                add_header Content-Type "text/css" always;
            }
            if ($request_uri ~* \.(js|mjs)$) {
                add_header Content-Type "application/javascript" always;
            }
        }


        # ========== 核心1：精准匹配媒体文件 /assets/Media/ ，指向后端真实目录 ==========
        # ^~ 最高优先级，匹配所有/media/子路径（Photos/Videos等）
        # alias 直接映射后端物理目录，自动替换/assets/Media/为后端真实路径
        location ^~ /backend-assets/ {
            alias         "D:/Soonwin_OA/SoonwinOA_Backend/assets/";  # 关键：指向后端assets/Media（已转Nginx正斜杠）
            try_files     $uri $uri/ =404;  # 找不到文件返回404，不跳转前端路由
            expires       7d;  # 媒体文件缓存7天，减轻服务器压力
            sendfile      on;  # 开启零拷贝，优化大文件（视频/图片）传输
            tcp_nopush    on;
            tcp_nodelay   on;
            # 允许跨域访问（前端调用后端媒体文件避免跨域报错）
            add_header    Access-Control-Allow-Origin *;
            add_header    Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            # 处理OPTIONS预检请求
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        # ==============================================================================


        location /api/ {
            proxy_pass http://backend_server;  # 无末尾/，保留/api
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            # 新增：跨域头（避免移动端跨域报错）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization';

            # 新增：处理OPTIONS预检请求（避免跨域报错）
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 修复6：正则表达式转义正确（Nginx需要的是 /\.）
        location ~ /\\. {
            deny all;
        }
    }
}
